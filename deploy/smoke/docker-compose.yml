# PHASE-8 release rollout package: single-node smoke e2e.
#
# NOT part of the default `go test ./...` gate. Run via run.sh, or manually:
#
#   docker compose -f deploy/smoke/docker-compose.yml up --build
#
# Build context is the repo root (".." from here is deploy/, ".." again is
# the repo root) -- same layout as deploy/e2e-ha, whose Dockerfile COPY
# paths are rooted at go-app/ one level below the repo root.
#
# Two services only: the app (amp-upstream with a plain alertmanager.yml, no
# AMP config, so no Postgres) and a minimal webhook sink
# (webhook_receiver.py) that stands in for a real alerting destination. This complements deploy/e2e-ha's
# 2-replica HA test with a fast single-node pre-release check.
name: amp-smoke

services:
  webhook:
    image: python:3-alpine
    volumes:
      - ./webhook_receiver.py:/app/webhook_receiver.py:ro
    working_dir: /app
    command: ["python3", "webhook_receiver.py"]
    ports:
      - "18090:8090"
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8090/healthz', timeout=2)"]
      interval: 2s
      timeout: 2s
      retries: 15

  amp:
    build:
      context: ../..
      dockerfile: Dockerfile
    # One node: no gossip listener.
    command:
      - --config.file=/etc/amp/alertmanager.yml
      - --storage.path=/data
      - --cluster.listen-address=
    volumes:
      # AMP_SMOKE_CONFIG_DIR is a run.sh-managed mktemp scratch dir (never
      # this repo's own deploy/smoke/), seeded with a copy of
      # alertmanager.yml. NOT :ro -- run.sh's reload step overwrites it with
      # alertmanager-reloaded.yml, then POSTs /-/reload. Falls back to this
      # directory for a manual `docker compose up` (read-only use only --
      # the fallback path IS the tracked alertmanager.yml).
      - ${AMP_SMOKE_CONFIG_DIR:-.}/alertmanager.yml:/etc/amp/alertmanager.yml
    ports:
      - "18080:9093"
    depends_on:
      webhook:
        condition: service_healthy
