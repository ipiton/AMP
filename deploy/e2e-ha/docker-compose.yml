# Two-replica HA stack of the upstream Alertmanager core (ADR-019,
# UPSTREAM-HA-MEMBERLIST): amp-a and amp-b run /app/amp-upstream as one
# memberlist cluster, the sink records every webhook notification.
#
# NOT part of the default `go test ./...` gate. Run via run.sh, or manually:
#
#   docker compose -f deploy/e2e-ha/docker-compose.yml up --build
#
# Build context is the repo root, where the Dockerfile lives.
name: amp-e2e-ha

x-amp: &amp
  build:
    context: ../..
    dockerfile: Dockerfile
  image: amp-e2e-ha:local
  # Root inside the container: the named data volume is created root-owned,
  # and step 7 of run.sh needs the snapshots to survive a restart, which a
  # tmpfs would not. The chart runs non-root and sets an fsGroup instead.
  user: "0:0"
  # Readiness, not the image's liveness HEALTHCHECK: run.sh starts once the
  # peers have settled.
  healthcheck:
    test: ["CMD", "wget", "-q", "--spider", "http://localhost:9093/-/ready"]
    interval: 2s
    timeout: 2s
    retries: 30
  depends_on:
    - sink

services:
  sink:
    image: python:3.13-alpine
    command: ["python3", "-u", "/sink.py"]
    volumes:
      - ./sink.py:/sink.py:ro

  # Shorter cluster timings than upstream's defaults keep the scenario quick:
  # peer-timeout bounds how long the second peer waits before checking the
  # shared notification log, settle-timeout how long notifications wait for
  # the gossip to settle.
  amp-a:
    <<: *amp
    hostname: amp-a
    command: &args
      - --config.file=/etc/amp-upstream/alertmanager.yml
      - --storage.path=/data
      - --web.listen-address=:9093
      - --cluster.listen-address=0.0.0.0:9094
      - --cluster.peer=amp-a:9094
      - --cluster.peer=amp-b:9094
      - --cluster.peer-timeout=5s
      - --cluster.settle-timeout=10s
      - --cluster.gossip-interval=100ms
      - --cluster.pushpull-interval=5s
    ports:
      - "18081:9093"
    volumes:
      - ./alertmanager.yml:/etc/amp-upstream/alertmanager.yml:ro
      - data-a:/data

  amp-b:
    <<: *amp
    hostname: amp-b
    command: *args
    ports:
      - "18082:9093"
    volumes:
      - ./alertmanager.yml:/etc/amp-upstream/alertmanager.yml:ro
      - data-b:/data

volumes:
  data-a:
  data-b:
