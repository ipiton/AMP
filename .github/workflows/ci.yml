# PR / main gate. Read-only: nothing here pushes images or writes to the
# repository -- publishing lives in release.yml, the only workflow with
# `packages: write` (ADR-013).
#
# Required checks for branch protection (docs/CI.md): gate,
# images (amp), images (config-reloader), actionlint. govulncheck and
# e2e-ha run on every PR but are not required yet -- see docs/CI.md for
# when each one becomes required.
#
# Every third-party action is pinned to a full commit SHA; the trailing
# comment names the release it resolves to.
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # The same gate a developer runs locally -- one source of truth, so CI and
  # ./scripts/release-gate.sh cannot drift apart.
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Picks the `toolchain` line of go-app/go.mod (go1.26.8).
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go-app/go.mod
          cache-dependency-path: go-app/go.sum
      - run: go version
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.13.2
          install-only: true
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v4.3.0
      - run: ./scripts/release-gate.sh

  # Proves both Dockerfiles build for every platform release.yml publishes.
  # Go cross-compiles on the runner's own platform; QEMU only runs the
  # arm64 runtime stage's `apk add`.
  images:
    name: images (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: amp
            file: Dockerfile
          - name: config-reloader
            file: Dockerfile.config-reloader
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ matrix.file }}
          platforms: linux/amd64,linux/arm64
          push: false
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  actionlint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go-app/go.mod
          cache: false
      - run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12

  # Not required until PROD-DEPS-VULN clears the known findings: a red
  # result here is expected and honest, not masked by continue-on-error.
  govulncheck:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go-app/go.mod
          cache-dependency-path: go-app/go.sum
      - working-directory: go-app
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...

  # Two-replica HA scenario (deploy/e2e-ha). Timing-based on a shared
  # runner, so it is not required until it has a clean track record
  # (BACKLOG CI-E2E-HA-REQUIRED).
  e2e-ha:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: ./deploy/e2e-ha/run.sh
