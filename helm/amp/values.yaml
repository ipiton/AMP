# ===============================
# Application Configuration
# ===============================
replicaCount: 1
environment: production
logLevel: info
namespace: ""

# ===============================
# Deployment Profile (TN-96)
# ===============================
# Profile determines the deployment architecture:
# - "lite": Single-node, embedded storage (SQLite), memory-only cache, zero external dependencies
# - "standard": PostgreSQL + Valkey, distributed cache. Defaults fit one node
#   (1 replica, HPA off); HA is opt-in: autoscaling.enabled or values-production.yaml
profile: "standard"  # Options: "lite" | "standard"

# ===============================
# Container Image Configuration
# ===============================
image:
  repository: ghcr.io/ipiton/amp
  tag: ""            # defaults to .Chart.AppVersion
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

# ===============================
# Service Account Configuration
# ===============================
serviceAccount:
  create: true
  annotations: {}
  name: ""
  # RBAC for publishing target discovery (templates/rbac.yaml, ADR-012):
  # one Role with `list` on secrets in publishing.discovery.namespace
  # (default: the release namespace). Rendered only when the app actually
  # talks to the K8s API: profile=standard and publishing.enabled. Set to
  # false to manage the ServiceAccount's permissions yourself.
  rbac:
    create: true

# ===============================
# Pod Security and Resource Configuration
# ===============================
podAnnotations: {}
podLabels: {}

podSecurityContext:
  fsGroup: 65534
  runAsNonRoot: true
  runAsUser: 65534

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
    - ALL
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  runAsUser: 65534

# Requests are sized for one node: idle/light load measured at ~15m CPU / ~20Mi
# (tasks/archive/HELM-SINGLE-NODE-DEFAULTS/evidence/idle-top.txt). Limits keep
# the burst headroom.
resources:
  limits:
    cpu: 1000m
    memory: 1Gi
  requests:
    cpu: 100m
    memory: 128Mi

# ===============================
# Pod Disruption Budget (app Deployment)
# ===============================
# Disabled by default (replicaCount: 1 makes a PDB pointless / can block all
# voluntary drains). Production sets enabled: true — see values-production.yaml.
podDisruptionBudget:
  enabled: false
  minAvailable: 1
  # maxUnavailable: 1  # alternative to minAvailable; minAvailable wins if both are set

# ===============================
# Service Configuration (Load Balancing)
# ===============================
service:
  type: ClusterIP
  port: 8080
  metricsPort: 9090
  annotations: {}
  # Load balancing configuration
  loadBalancerPolicy: false  # Set to true for session affinity
  sessionAffinityTimeout: 10800  # 3 hours

# ===============================
# Ingress Configuration
# ===============================
# PROD-INGRESS-HARDENING (ADR-015): an Ingress publishes the whole AMP API,
# including POST /api/v2/silences and POST /-/reload. The chart refuses to
# render one unless the API is protected, either in-process
# (webConfig.existingSecret, below) or by the ingress/proxy in front of it
# (externalAuth: true).
ingress:
  enabled: false
  className: ""
  # true = authentication is enforced by the ingress controller or a proxy
  # (oauth2-proxy, nginx auth-url / auth-secret annotations, ...). The chart
  # cannot verify this: it is the operator's statement, not a check.
  externalAuth: false
  annotations: {}
    # kubernetes.io/ingress.class: nginx
    # kubernetes.io/tls-acme: "true"
  hosts:
    - host: amp.local
      paths:
        - path: /
          pathType: Prefix
  tls: []
  #  - secretName: amp-tls
  #    hosts:
  #      - amp.local

# ===============================
# NetworkPolicy for AMP pods (PROD-INGRESS-HARDENING, ADR-015)
# ===============================
# Restricts INGRESS to the AMP pods to the sources listed below, on the `http`
# port only (API, /metrics and probes all share it). Egress is not restricted:
# notification targets (Slack, PagerDuty, webhooks, LLM APIs) are arbitrary,
# and a default-deny egress would silently stop delivery.
#
# Every list is a list of NetworkPolicyPeer (namespaceSelector / podSelector /
# ipBlock). Prefer the automatic namespace label kubernetes.io/metadata.name:
#   alertSenders:
#     - namespaceSelector:
#         matchLabels:
#           kubernetes.io/metadata.name: monitoring
#       podSelector:
#         matchLabels:
#           app.kubernetes.io/name: prometheus
# Senders reaching AMP through a LoadBalancer/NodePort arrive from node or LB
# addresses: use an ipBlock.
#
# Enabled with no effective source, the chart fails to render: such a policy
# would drop every alert sender. Kubelet probes come from the node and are not
# affected on conformant CNIs. On a CNI without NetworkPolicy support the
# object is accepted and does nothing.
#
# Kill-switch if real traffic is blocked (removes the policy, no restart):
#   helm upgrade <release> <chart> --reuse-values --set networkPolicy.enabled=false
networkPolicy:
  enabled: false
  # Ingress controller pods. Used only when ingress.enabled is true.
  ingressController: []
  # Prometheus, vmalert, ... posting alerts to the Service directly.
  alertSenders: []
  # Whoever scrapes /metrics (the Prometheus behind the ServiceMonitor below).
  metricsScrapers: []
  # Raw NetworkPolicyIngressRule entries, rendered as-is.
  extraIngress: []

# ===============================
# Health Probes Configuration (12-Factor App)
# ===============================
probes:
  liveness:
    # /-/healthy and /-/ready run the same liveness/readiness checks as
    # /healthz and /readyz but answer plain text, so they stay reachable
    # without credentials when webConfig enables authentication (PROD-AUTH).
    path: /-/healthy
    initialDelaySeconds: 30
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3
  readiness:
    path: /-/ready
    initialDelaySeconds: 5
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 3
  startup:
    path: /-/healthy
    initialDelaySeconds: 10
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 30

# ===============================
# HTTP authentication (PROD-AUTH)
# ===============================
# Basic auth for the whole HTTP API, from an upstream-compatible web config
# file (Alertmanager's --web.config.file format). Empty existingSecret = auth
# disabled (AMP logs a WARN at startup).
#
# The chart does not create the Secret: the password must be bcrypt-hashed by
# the operator, e.g.
#   htpasswd -nBC 10 prometheus | cut -d: -f2
#   kubectl create secret generic amp-web-config --from-file=web-config.yml
# with web-config.yml:
#   basic_auth_users:
#     prometheus: $2y$10$...
#
# Probes use /-/healthy and /-/ready, which are unauthenticated by default
# (server.auth.unauthenticated_paths). /metrics is protected: give the
# ServiceMonitor basicAuth, or add /metrics to unauthenticated_paths.
# Not yet compatible with configReloader (the sidecar cannot authenticate).
webConfig:
  existingSecret: ""
  secretKey: web-config.yml
  mountPath: /etc/amp/web

# ===============================
# Horizontal Pod Autoscaler
# ===============================
# Off by default: the defaults target one node (replicaCount: 1).
# values-production.yaml turns it on. The targets are percentages of
# resources.requests: with the default 100m/128Mi the HPA scales out at ~70m
# CPU per pod, so raise the requests along with it. With the bundled
# PostgreSQL, raise postgresql.config.maxConnections for maxReplicas first
# (NOTES warns).
autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80
  customMetrics:
    enabled: true
    requestsPerSecond: "50"
    classificationQueueSize: "10"
    publishingQueueSize: "20"
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      percentPolicy: 50
      podsPolicy: 2
      periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 60
      percentPolicy: 100
      podsPolicy: 4
      periodSeconds: 30

# ===============================
# Deployment Strategy
# ===============================
strategy:
  type: RollingUpdate
  maxUnavailable: 25%
  maxSurge: 25%

# ===============================
# Graceful Shutdown Configuration (12-Factor App)
# ===============================
# On pod termination: preStop sleeps preStopDelay seconds while Kubernetes
# removes the pod from Service endpoints, then SIGTERM makes AMP report not
# ready, drain in-flight HTTP requests and stop its services (final snapshot,
# flushes) within timeoutSeconds. Keep
#   terminationGracePeriodSeconds >= preStopDelay + timeoutSeconds
# or the kubelet may SIGKILL the pod mid-drain; NOTES.txt warns when it is not.
gracefulShutdown:
  terminationGracePeriodSeconds: 40  # Total budget before SIGKILL, counted from the start of preStop
  preStopDelay: 5  # Seconds the preStop hook sleeps (needs `sleep` in the image); 0 disables the hook
  # Passed to AMP as server.graceful_shutdown_timeout; 0 means 30s.
  timeoutSeconds: 30

# ===============================
# Secrets Management Configuration
# ===============================
secrets:
  # Application secrets (base64 encoded in secrets)
  jwtSecret: ""  # JWT signing secret
  encryptionKey: ""  # Data encryption key

  # External secrets (if using external secret operators)
  externalSecrets:
    enabled: false
    secretStore: ""  # External secret store name

# ===============================
# Lite Profile Configuration (TN-96)
# ===============================
# Storage for Lite profile (SQLite database)
liteProfile:
  persistence:
    enabled: true
    size: 5Gi
    storageClass: ""
    mountPath: "/data"
  # Resource limits for Lite profile
  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 250m
      memory: 256Mi

# ===============================
# PostgreSQL Database Configuration (Standard Profile Only)
# ===============================
# Automatically disabled for Lite profile
#
# Bundled PostgreSQL: dev/pilot only (ADR-016). A single instance with no
# replication and no backups; AMP's alert ingest depends on it, so losing it
# means losing alert history and silences. Production: external PostgreSQL
# with backups/PITR (README "PostgreSQL"). Manual backups and restore:
# helm/amp/docs/POSTGRESQL_RESTORE_GUIDE.md.
postgresql:
  enabled: true  # Overridden by profile in deployment.yaml
  replicas: 1  # Must stay 1: no replication; anything else fails the render
  # Database configuration
  database: "alert_history"
  username: "alert_history"
  # DEV-ONLY DEFAULT below — not safe for production. values-production.yaml
  # no longer has a postgresql block (external database, HELM-EXTERNAL-DATABASE),
  # so a release that turns the bundled PostgreSQL back on must set its own
  # password: this Secret's template has no random-generation fallback, and
  # without an override it inherits this literal. Ledgered as an
  # inconsistency in docs/06-planning/TECH-DEBT.md (HELM-CHART-GAPS) rather
  # than changed here — a no-default/required key would break the
  # zero-config dev/test install path this default exists for.
  password: "secure_password_123"
  # Sized for config below (max_connections=100, shared_buffers=128MB) on one
  # node; idle/light load measured at ~40m CPU / ~55Mi. Raise together with
  # config.maxConnections/sharedBuffers.
  resources:
    limits:
      cpu: 1000m
      memory: 1Gi
    requests:
      cpu: 100m
      memory: 256Mi
  # Storage configuration
  persistence:
    enabled: true
    size: 10Gi
    storageClass: ""

  # PostgreSQL Exporter (TN-98: metrics sidecar)
  exporter:
    enabled: true  # Enable postgres-exporter sidecar
    image: quay.io/prometheuscommunity/postgres-exporter
    tag: "v0.15.0"  # Latest stable as of 2024
    pullPolicy: IfNotPresent
    resources:
      limits:
        cpu: 100m
        memory: 128Mi
      requests:
        cpu: 10m
        memory: 32Mi

  # PostgreSQL Monitoring (TN-98: observability)
  monitoring:
    prometheusRules:
      enabled: true  # Enable Prometheus alerting rules
    # Grafana dashboard: Import from https://grafana.com/grafana/dashboards/9628 (PostgreSQL Database)

  # PostgreSQL Network Policy (TN-98: Security hardening)
  networkPolicy:
    enabled: false  # Enable in production for network isolation

  # PostgreSQL Configuration
  # Connection budget: 25 per AMP pod (database.max_connections default) plus
  # the exporter. AMP connects as postgresql.username, which is the bootstrap
  # superuser, so superuserReservedConnections reserves nothing from it: the
  # whole maxConnections is the budget. 100 covers 3 AMP pods (the default pod,
  # a rolling-update surge pod and one more). With autoscaling, raise it to at
  # least maxReplicas × 25 + 5 (and memory with it); NOTES warns when it is short.
  config:
    maxConnections: 100
    superuserReservedConnections: 10

    # Memory Settings (sized for resources.limits.memory: 1Gi)
    sharedBuffers: "128MB"
    effectiveCacheSize: "512MB"
    workMem: "4MB"  # Per-operation memory
    maintenanceWorkMem: "64MB"  # For VACUUM, indexes

    # WAL Settings
    walBuffers: "16MB"
    maxWalSize: "4GB"
    minWalSize: "1GB"
    checkpointCompletionTarget: 0.9

    # Query Planning (SSD-optimized, TN-97)
    randomPageCost: 1.1  # Down from 4.0 (HDD default)
    effectiveIoConcurrency: 200  # Up from 1 (HDD default)

    # Monitoring (TN-97: pg_stat_statements)
    sharedPreloadLibraries: "pg_stat_statements"
    trackActivities: "on"
    trackCounts: "on"
    trackIoTiming: "on"

    # Logging (adjust for debugging connection issues)
    loggingCollector: "off"  # "on" writes logs to $PGDATA/pg_log on the PVC (never deleted) instead of kubectl logs
    logConnections: "off"  # Enable for debugging (performance hit)
    logDisconnections: "off"
    logMinDurationStatement: 1000  # Log queries > 1s

    # Autovacuum (TN-97: critical for high-write alert ingestion)
    autovacuum: "on"
    autovacuumMaxWorkers: 3
    autovacuumNaptime: "1min"

    # Security (TN-98: production hardening)
    ssl: "off"  # The bundled PostgreSQL has no TLS support yet (no certificate mount); the chart then sets database.allow_insecure_ssl_in_production for AMP

# ===============================
# External PostgreSQL (Standard Profile Only)
# ===============================
# The supported production database (ADR-016): PostgreSQL >= 16 run outside
# this chart. Set postgresql.enabled=false and fill in host, database, username
# and existingSecret. The chart passes these to AMP as DATABASE_* env vars,
# which take precedence over a `database:` section in configFile.content.
# Ignored by the lite profile.
externalDatabase:
  host: ""  # Empty = not used. Set it to switch AMP to this database
  port: 5432
  database: ""  # Required when host is set
  username: ""  # Required when host is set
  # disable | require | verify-ca | verify-full: the modes AMP accepts (allow
  # and prefer fail the render). With environment=production AMP refuses to
  # start on "disable"; the chart does not set the insecure-SSL override for an
  # external database. verify-ca/verify-full check the server certificate
  # against the image's system roots only: a provider CA (RDS etc.) is not in
  # there, and the chart mounts no client TLS material.
  sslMode: require
  # Required when host is set. The chart does NOT create this Secret. From a
  # file with no trailing newline (AMP does not trim the password):
  #   (umask 077; printf '%s' "$PASSWORD" > amp-db-password)
  #   kubectl create secret generic amp-db --from-file=password=amp-db-password
  # With environment=production AMP requires a password of 12+ characters.
  # The password is read at pod start: after changing the Secret, run
  # kubectl rollout restart deploy/<fullname>.
  existingSecret: ""
  existingSecretPasswordKey: password

# ===============================
# Valkey Cache Configuration (Redis-compatible, Standard Profile Only)
# ===============================
# Automatically disabled for Lite profile (uses memory-only cache)
# ===============================
# External Secrets Operator (TN-100: Production Security)
# ===============================
# Enable External Secrets Operator for production secret management
# Integrates with AWS Secrets Manager, GCP Secret Manager, Azure Key Vault, HashiCorp Vault
externalSecrets:
  enabled: false  # Set to true in production with ESO installed
  secretStore: "default"  # Name of SecretStore or ClusterSecretStore
  secretStoreKind: "SecretStore"  # SecretStore or ClusterSecretStore
  refreshInterval: "1h"  # How often to sync secrets
  keyPath: "alertmanager-plus-plus"  # Path in secret manager

cache:
  enabled: true  # Overridden by profile in deployment.yaml
  # Valkey connection details
  host: "{{ include \"amp.fullname\" . }}-redis"  # Service name of Redis/Valkey
  port: 6379
  # Valkey authentication (if needed)
  auth:
    enabled: false
    password: ""

# ===============================
# Valkey StatefulSet Configuration (<fullname>-redis)
# ===============================
# The chart's one in-cluster cache, Standard Profile only. Valkey (BSD-3), not
# Redis: Redis >= 7.4 is RSALv2/SSPL (ADR-017). AMP pool: 10 conns/pod
# (redis.pool_size); Valkey maxclients 10,000 (default).
valkey:
  enabled: true  # Managed by profile in deployment

  # Deployment configuration
  replicas: 1  # Expandable to 3 for Sentinel HA in future

  # Container image. Valkey 8.1 cannot load data written by Redis >= 7.4
  # (RDB v12): when repository contains "valkey", the init container moves
  # such files to /data/redis-pre-valkey-<ts>/ and Valkey starts without them
  # (CHANGELOG migration notes). A Valkey mirror under another name skips the
  # move; set repository and tag together.
  image:
    repository: valkey/valkey
    tag: "8.1.10-alpine"
    pullPolicy: IfNotPresent

  # Idle/light load measured at ~10m CPU / ~5Mi; the limit bounds maxmemory below.
  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 50m
      memory: 64Mi

  # Persistence (TN-99: enabled for durability)
  storage:
    className: ""
    requestedSize: 5Gi

  # Valkey settings
  settings:
    maxmemory: 384mb  # 75% of 512Mi limit (leaves headroom for overhead)
    maxmemoryPolicy: allkeys-lru  # Evict least recently used keys
    appendonly: "yes"  # AOF persistence enabled (write-ahead log)
    appendfsync: everysec  # Fsync every 1s (balance performance/durability, <1s data loss)
    loglevel: notice  # Options: debug, verbose, notice, warning
    slowlogThreshold: 10000  # Log queries >10ms (microseconds)

  # redis-exporter Sidecar (Prometheus metrics)
  exporter:
    enabled: true
    image: quay.io/oliver006/redis_exporter
    tag: v1.55.0
    pullPolicy: IfNotPresent
    resources:
      limits:
        cpu: 100m
        memory: 128Mi
      requests:
        cpu: 10m
        memory: 32Mi

  # Password authentication (Secret management)
  password:
    # Use existing Secret (recommended for production)
    existingSecret: ""  # If empty, creates new Secret
    secretKey: password
    # Password value (only used if existingSecret is empty)
    # In production: Set via Helm values or External Secrets Operator (TN-100)
    value: ""  # If empty, generates random 32-char password

  # NetworkPolicy (pod isolation)
  networkPolicy:
    enabled: false  # Enable in production for security hardening

# ===============================
# Alert Processing Configuration
# ===============================
alerts:
  retentionDays: 30
  batchSize: 100
  maxConcurrentAlerts: 50
  enableClassification: true

# ===============================
# LLM Configuration
# ===============================
llm:
  # Off by default: there is no key to use. To enable, set enabled=true and
  # either apiKey or externalSecrets.enabled (llm_api_key in the store);
  # otherwise the render fails.
  enabled: false
  proxyUrl: "https://llm-proxy.example.com"
  apiKey: ""  # Set via local override, environment, or secret; never commit real keys
  model: "openai/gpt-4o"
  timeout: 30
  maxRetries: 3
  retryDelay: 1.0
  cacheTtl: 3600
  batchSize: 10

  # LLM API Key Secret (prefer external secrets in production)
  secret:
    enabled: false
    name: "llm-api-key"
    key: "api-key"

  # External secrets configuration
  externalSecrets:
    enabled: false
    secretStore: ""
    secretName: ""
    secretKey: "api-key"

# ===============================
# Investigation Pipeline (PHASE-5A / 5B)
# ===============================
# Async LLM-driven alert investigation.
# Requires: profile=standard, Postgres, llm.enabled=true.
investigation:
  enabled: false
  workerCount: 3
  queueSize: 500
  maxRetries: 3
  retryInterval: 5s
  llmTimeout: 60s
  onlyFiring: true

# ===============================
# Database Migration Configuration
# ===============================
migration:
  enabled: false
  autoMigrate: false
  batchSize: 1000
  verifyData: true
  backupBeforeMigration: true

# ===============================
# Monitoring Configuration
# ===============================
monitoring:
  prometheusEnabled: true
  healthCheckInterval: 30
  # ServiceMonitor for AMP itself (prometheus-operator). Rendered only when
  # prometheusEnabled is also true. Scrapes /metrics on the `http` port.
  serviceMonitor:
    enabled: true
    interval: 30s
    scrapeTimeout: 10s
    # Extra labels on the ServiceMonitor, e.g. what the Prometheus
    # serviceMonitorSelector matches on (release: kube-prometheus-stack).
    labels: {}
    # With webConfig.existingSecret, /metrics requires credentials and the chart
    # refuses to render a ServiceMonitor without them (it would only ever get
    # 401). The Secret lives in the release namespace and holds the PLAIN
    # username/password of a web-config user, not the bcrypt hash:
    #   kubectl create secret generic amp-metrics-auth \
    #     --from-literal=username=prometheus --from-literal=password=...
    basicAuth:
      secretName: ""
      usernameKey: username
      passwordKey: password

# ===============================
# Alert Publishing Configuration
# ===============================
publishing:
  enabled: true
  discovery:
    namespace: ""
    labelSelector: "publishing-target=true"
  queue:
    maxConcurrent: 10
    workerCount: 10
    highPriorityQueueSize: 500
    mediumPriorityQueueSize: 1000
    lowPriorityQueueSize: 500
    maxRetries: 3
    retryInterval: "2s"
    stopTimeout: "10s"
    jobTrackingCapacity: 10000
    # publishing.queue.delivery_confirmation_timeout (config.go viper default "45s",
    # hard-capped at 2m by MaxDeliveryConfirmationTimeout). Per-target wait for a
    # confirmed HTTP delivery before a fire is treated as unconfirmed/retried.
    # grouping.reconciliationGrace below derives from this value when left unset
    # — raise both together, never this alone (see that key's comment).
    deliveryConfirmationTimeout: "45s"
  templates:
    # publishing.templates.enabled (config.go viper default true = upstream-compatible
    # template rendering: templates:// files + per-integration presentation fields
    # render for real). false reverts to AMP's pre-templates-epic fixed formatters
    # wholesale. Read at startup only — flipping it needs a restart, not a reload.
    enabled: true
  refresh:
    enabled: true
    interval: "5m"
    maxRetries: 5
    baseBackoff: "30s"
    maxBackoff: "5m"
    rateLimitPer: "1m"
    timeout: "30s"
    warmupPeriod: "30s"
  health:
    enabled: true
    checkInterval: "2m"
    httpTimeout: "5s"
    warmupDelay: "10s"
    failureThreshold: 3
    degradedThreshold: "5s"
    maxConcurrentChecks: 10
    maxIdleConns: 100
    tlsSkipVerify: false
    followRedirects: true
    maxRedirects: 3

# ===============================
# Grouping / Notify-Chain (alertmanager-parity waves 2-4)
# ===============================
# grouping.enabled (default true, same as config.go) gives real
# group_by/group_wait/group_interval/repeat_interval dispatch and notify-log dedup.
# It only takes effect when the loaded config has a route: tree; without one alerts
# are published directly. Standard profile: state in Redis, shared across replicas
# (in memory, not shared, when Redis is unavailable). Lite profile: state in
# memory, single replica. Set false to publish every alert
# as soon as it arrives (AMP then warns at startup if a route: tree is configured).
# Read at startup only -- changing it needs a pod restart, not a config reload.
# Set it here, not in configFile.content: the chart passes this value as
# GROUPING_ENABLED, which overrides the key in the config file.
grouping:
  enabled: true
  reconciliationInterval: "45s"
  # reconciliation_grace deliberately has NO default here (empty string = key
  # omitted from the rendered ConfigMap): ServiceRegistry derives the effective
  # grace from the ACTUAL configured publishing.queue.deliveryConfirmationTimeout
  # via grouping.ReconciliationGraceFor when this is left unset. An explicit value
  # here always wins, and startup validation still rejects a result that violates
  # the notify-timing budget (must exceed the publish-claim TTL, timeout + 20s).
  reconciliationGrace: ""

# ===============================
# Storage snapshots (lite profile only — restart durability)
# ===============================
# storage.path/snapshotInterval back the lite profile's file-snapshot durability
# for silences + notify-log dedup state (config.go default: path "" = disabled).
# The standard profile already owns durability via Postgres/Redis and logs-and-skips
# snapshotting even if a path is set here — never engaged, verified by dedicated tests.
storage:
  path: ""
  snapshotInterval: "5m"

# ===============================
# Silence cross-replica sync intervals
# ===============================
# Restart-only knobs (config.go defaults shown; validated at startup: backoff must
# stay strictly below the resync interval).
silencing:
  subscribeRetryBackoff: "2s"
  periodicResyncInterval: "5m"

# ===============================
# Rootly Integration (Priority)
# ===============================
rootly:
  enabled: false  # Set to true to enable Rootly integration

  # Rootly API configuration
  webhookUrl: ""  # Rootly webhook URL (required)
  apiKey: ""      # Rootly API key (prefer external secrets)
  authToken: ""   # Optional auth token
  orgId: ""       # Rootly organization ID

  # Custom headers for Rootly API
  customHeaders: {}
    # X-Custom-Header: "value"

  # Incident management settings
  incidentSettings:
    autoCreate: true          # Auto-create incidents from critical alerts
    severity: "high"          # Default incident severity
    assignTeam: ""            # Default team assignment
    tags: []                  # Default incident tags
      # - "kubernetes"
      # - "production"

  # Rootly-specific filtering
  filterConfig:
    severity: ["critical", "warning"]     # Only forward critical/warning alerts
    namespaces: ["production"]            # Production namespace only
    excludeNoise: true                    # Exclude noisy alerts
    minConfidence: 0.8                    # High confidence threshold
    alertNamePattern: ""                  # Optional regex pattern

    # Rootly-specific filters
    incidentTypes: ["infrastructure", "application"]  # Incident types
    services: []              # Target specific services
      # - "api-gateway"
      # - "database"
    environments: ["production"]  # Target environments

