# ===============================
# Application Configuration
# ===============================
# app.environment in the AMP configuration (production tightens the database
# checks: TLS and a 12+ character password).
environment: production
namespace: ""

# ===============================
# Profile (TN-96)
# ===============================
# Profile determines what runs next to the Alertmanager core (amp-upstream):
# - "lite": the core alone: no alert history, investigations or K8s-Secret
#   publishing targets, no Valkey (set postgresql.enabled=false too: the
#   bundled PostgreSQL is not tied to the profile).
# - "standard": PostgreSQL (alert history, investigations) and Valkey. Defaults
#   fit one node (alertmanager.replicas: 1); HA is opt-in: alertmanager.replicas
#   > 1 or values-production.yaml.
profile: "standard"  # Options: "lite" | "standard"

# ===============================
# Container Image Configuration
# ===============================
image:
  repository: ghcr.io/ipiton/amp
  tag: ""            # defaults to .Chart.AppVersion
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

# ===============================
# Service Account Configuration
# ===============================
serviceAccount:
  create: true
  annotations: {}
  name: ""
  # RBAC for publishing target discovery (templates/rbac.yaml, ADR-012):
  # one Role with `list` on secrets in publishing.discovery.namespace
  # (default: the release namespace). Rendered only when the app actually
  # talks to the K8s API: profile=standard and publishing.enabled. Set to
  # false to manage the ServiceAccount's permissions yourself.
  rbac:
    create: true

# ===============================
# Pod Security and Resource Configuration
# ===============================
podAnnotations: {}
podLabels: {}

podSecurityContext:
  fsGroup: 65534
  runAsNonRoot: true
  runAsUser: 65534

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
    - ALL
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  runAsUser: 65534

# Requests are sized for one node: idle/light load measured at ~15m CPU / ~20Mi
# (tasks/archive/HELM-SINGLE-NODE-DEFAULTS/evidence/idle-top.txt). Limits keep
# the burst headroom.
resources:
  limits:
    cpu: 1000m
    memory: 1Gi
  requests:
    cpu: 100m
    memory: 128Mi

# ===============================
# Pod Disruption Budget (AMP StatefulSet)
# ===============================
# Disabled by default (alertmanager.replicas: 1 makes a PDB pointless / can
# block all voluntary drains). Production sets enabled: true — see values-production.yaml.
podDisruptionBudget:
  enabled: false
  minAvailable: 1
  # maxUnavailable: 1  # alternative to minAvailable; minAvailable wins if both are set

# ===============================
# Service Configuration
# ===============================
# <fullname>: api/v2, /-/*, /metrics on the `web` port. With one replica
# Prometheus can send alerts to it; with more, every pod must receive every
# alert: list the pods (<fullname>-<i>.<fullname>-headless:9093), not the
# Service.
service:
  type: ClusterIP
  port: 9093
  annotations: {}

# ===============================
# Ingress Configuration
# ===============================
# PROD-INGRESS-HARDENING (ADR-015): an Ingress publishes the whole AMP API,
# including POST /api/v2/silences and POST /-/reload. The chart refuses to
# render one unless the API is protected, either in-process
# (webConfig.existingSecret, below) or by the ingress/proxy in front of it
# (externalAuth: true).
ingress:
  enabled: false
  className: ""
  # true = authentication is enforced by the ingress controller or a proxy
  # (oauth2-proxy, nginx auth-url / auth-secret annotations, ...). The chart
  # cannot verify this: it is the operator's statement, not a check.
  externalAuth: false
  annotations: {}
    # kubernetes.io/ingress.class: nginx
    # kubernetes.io/tls-acme: "true"
  hosts:
    - host: amp.local
      paths:
        - path: /
          pathType: Prefix
  tls: []
  #  - secretName: amp-tls
  #    hosts:
  #      - amp.local

# ===============================
# NetworkPolicy for AMP pods (PROD-INGRESS-HARDENING, ADR-015)
# ===============================
# Restricts INGRESS to the AMP pods to the sources listed below, on the `web`
# port only (API, /metrics and probes all share it), plus the gossip port
# between the pods themselves when alertmanager.replicas > 1. Egress is not restricted:
# notification targets (Slack, PagerDuty, webhooks, LLM APIs) are arbitrary,
# and a default-deny egress would silently stop delivery.
#
# Every list is a list of NetworkPolicyPeer (namespaceSelector / podSelector /
# ipBlock). Prefer the automatic namespace label kubernetes.io/metadata.name:
#   alertSenders:
#     - namespaceSelector:
#         matchLabels:
#           kubernetes.io/metadata.name: monitoring
#       podSelector:
#         matchLabels:
#           app.kubernetes.io/name: prometheus
# Senders reaching AMP through a LoadBalancer/NodePort arrive from node or LB
# addresses: use an ipBlock.
#
# Enabled with no effective source, the chart fails to render: such a policy
# would drop every alert sender. Kubelet probes come from the node and are not
# affected on conformant CNIs. On a CNI without NetworkPolicy support the
# object is accepted and does nothing.
#
# Kill-switch if real traffic is blocked (removes the policy, no restart):
#   helm upgrade <release> <chart> --reuse-values --set networkPolicy.enabled=false
networkPolicy:
  enabled: false
  # Ingress controller pods. Used only when ingress.enabled is true.
  ingressController: []
  # Prometheus, vmalert, ... posting alerts to the Service directly.
  alertSenders: []
  # Whoever scrapes /metrics (the Prometheus behind the ServiceMonitor below).
  metricsScrapers: []
  # Raw NetworkPolicyIngressRule entries, rendered as-is.
  extraIngress: []

# ===============================
# Health Probes Configuration (12-Factor App)
# ===============================
# Paths are relative to the path of alertmanager.externalURL, which prefixes
# every endpoint. /-/healthy and /-/ready stay reachable without credentials
# when webConfig enables authentication (server.auth.unauthenticated_paths).
probes:
  liveness:
    path: /-/healthy
    initialDelaySeconds: 30
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3
  readiness:
    path: /-/ready
    initialDelaySeconds: 5
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 3
  startup:
    path: /-/healthy
    initialDelaySeconds: 10
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 30

# ===============================
# HTTP authentication (PROD-AUTH)
# ===============================
# Basic auth for the whole HTTP API, from an upstream-compatible web config
# file (Alertmanager's --web.config.file format). Empty existingSecret = auth
# disabled.
#
# The chart does not create the Secret: the password must be bcrypt-hashed by
# the operator, e.g.
#   htpasswd -nBC 10 prometheus | cut -d: -f2
#   kubectl create secret generic amp-web-config --from-file=web-config.yml
# with web-config.yml:
#   basic_auth_users:
#     prometheus: $2y$10$...
#
# Probes use /-/healthy and /-/ready, which are unauthenticated by default
# (server.auth.unauthenticated_paths). /metrics is protected: give the
# ServiceMonitor basicAuth.
webConfig:
  existingSecret: ""
  secretKey: web-config.yml
  mountPath: /etc/amp/web

# ===============================
# Graceful Shutdown Configuration (12-Factor App)
# ===============================
# On pod termination: preStop sleeps preStopDelay seconds while Kubernetes
# removes the pod from Service endpoints, then SIGTERM makes amp-upstream drain
# in-flight HTTP requests (up to 5s), stop the core (final silence and
# notification-log snapshots) and AMP's workers. Keep
# terminationGracePeriodSeconds well above preStopDelay + 5s, or the kubelet
# may SIGKILL the pod mid-snapshot; NOTES.txt warns below preStopDelay + 10s.
gracefulShutdown:
  terminationGracePeriodSeconds: 40  # Total budget before SIGKILL, counted from the start of preStop
  preStopDelay: 5  # Seconds the preStop hook sleeps (needs `sleep` in the image); 0 disables the hook

# ===============================
# Secrets Management Configuration
# ===============================
secrets:
  # Application secrets (base64 encoded in secrets)
  jwtSecret: ""  # JWT signing secret
  encryptionKey: ""  # Data encryption key

  # External secrets (if using external secret operators)
  externalSecrets:
    enabled: false
    secretStore: ""  # External secret store name

# ===============================
# PostgreSQL Database Configuration (Standard Profile Only)
# ===============================
# AMP uses it with profile standard only.
#
# Bundled PostgreSQL: dev/pilot only (ADR-016). A single instance with no
# replication and no backups: losing it means losing alert history and
# investigations. Silences and the notification log live on the StatefulSet's
# own volumes (alertmanager.persistence), not here. Production: external PostgreSQL
# with backups/PITR (README "PostgreSQL"). Manual backups and restore:
# helm/amp/docs/POSTGRESQL_RESTORE_GUIDE.md.
postgresql:
  enabled: true  # AMP connects to it with profile standard only
  replicas: 1  # Must stay 1: no replication; anything else fails the render
  # Database configuration
  database: "alert_history"
  username: "alert_history"
  # DEV-ONLY DEFAULT below — not safe for production. values-production.yaml
  # no longer has a postgresql block (external database, HELM-EXTERNAL-DATABASE),
  # so a release that turns the bundled PostgreSQL back on must set its own
  # password: this Secret's template has no random-generation fallback, and
  # without an override it inherits this literal. Ledgered as an
  # inconsistency in docs/06-planning/TECH-DEBT.md (HELM-CHART-GAPS) rather
  # than changed here — a no-default/required key would break the
  # zero-config dev/test install path this default exists for.
  password: "secure_password_123"
  # Sized for config below (max_connections=100, shared_buffers=128MB) on one
  # node; idle/light load measured at ~40m CPU / ~55Mi. Raise together with
  # config.maxConnections/sharedBuffers.
  resources:
    limits:
      cpu: 1000m
      memory: 1Gi
    requests:
      cpu: 100m
      memory: 256Mi
  # Storage configuration
  persistence:
    enabled: true
    size: 10Gi
    storageClass: ""

  # PostgreSQL Exporter (TN-98: metrics sidecar)
  exporter:
    enabled: true  # Enable postgres-exporter sidecar
    image: quay.io/prometheuscommunity/postgres-exporter
    tag: "v0.15.0"  # Latest stable as of 2024
    pullPolicy: IfNotPresent
    resources:
      limits:
        cpu: 100m
        memory: 128Mi
      requests:
        cpu: 10m
        memory: 32Mi

  # PostgreSQL Monitoring (TN-98: observability)
  monitoring:
    prometheusRules:
      enabled: true  # Enable Prometheus alerting rules
    # Grafana dashboard: Import from https://grafana.com/grafana/dashboards/9628 (PostgreSQL Database)

  # PostgreSQL Network Policy (TN-98: Security hardening)
  networkPolicy:
    enabled: false  # Enable in production for network isolation

  # PostgreSQL Configuration
  # Connection budget: 25 per AMP pod (database.max_connections default) plus
  # the exporter. AMP connects as postgresql.username, which is the bootstrap
  # superuser, so superuserReservedConnections reserves nothing from it: the
  # whole maxConnections is the budget. 100 covers 3 AMP pods (a StatefulSet
  # rolls without a surge pod). With alertmanager.replicas > 3, raise it to at
  # least replicas × 25 + 5 (and memory with it); NOTES warns when it is short.
  config:
    maxConnections: 100
    superuserReservedConnections: 10

    # Memory Settings (sized for resources.limits.memory: 1Gi)
    sharedBuffers: "128MB"
    effectiveCacheSize: "512MB"
    workMem: "4MB"  # Per-operation memory
    maintenanceWorkMem: "64MB"  # For VACUUM, indexes

    # WAL Settings
    walBuffers: "16MB"
    maxWalSize: "4GB"
    minWalSize: "1GB"
    checkpointCompletionTarget: 0.9

    # Query Planning (SSD-optimized, TN-97)
    randomPageCost: 1.1  # Down from 4.0 (HDD default)
    effectiveIoConcurrency: 200  # Up from 1 (HDD default)

    # Monitoring (TN-97: pg_stat_statements)
    sharedPreloadLibraries: "pg_stat_statements"
    trackActivities: "on"
    trackCounts: "on"
    trackIoTiming: "on"

    # Logging (adjust for debugging connection issues)
    loggingCollector: "off"  # "on" writes logs to $PGDATA/pg_log on the PVC (never deleted) instead of kubectl logs
    logConnections: "off"  # Enable for debugging (performance hit)
    logDisconnections: "off"
    logMinDurationStatement: 1000  # Log queries > 1s

    # Autovacuum (TN-97: critical for high-write alert ingestion)
    autovacuum: "on"
    autovacuumMaxWorkers: 3
    autovacuumNaptime: "1min"

    # Security (TN-98: production hardening)
    ssl: "off"  # The bundled PostgreSQL has no TLS support yet (no certificate mount); the chart then sets database.allow_insecure_ssl_in_production for AMP

# ===============================
# External PostgreSQL (Standard Profile Only)
# ===============================
# The supported production database (ADR-016): PostgreSQL >= 16 run outside
# this chart. Set postgresql.enabled=false and fill in host, database, username
# and existingSecret. The chart writes them into the AMP configuration
# (<fullname>-amp-config) and passes the password as DATABASE_PASSWORD.
# Ignored by the lite profile.
externalDatabase:
  host: ""  # Empty = not used. Set it to switch AMP to this database
  port: 5432
  database: ""  # Required when host is set
  username: ""  # Required when host is set
  # disable | require | verify-ca | verify-full: the modes AMP accepts (allow
  # and prefer fail the render). With environment=production AMP refuses to
  # start on "disable"; the chart does not set the insecure-SSL override for an
  # external database. verify-ca/verify-full check the server certificate
  # against the image's system roots only: a provider CA (RDS etc.) is not in
  # there, and the chart mounts no client TLS material.
  sslMode: require
  # Required when host is set. The chart does NOT create this Secret. From a
  # file with no trailing newline (AMP does not trim the password):
  #   (umask 077; printf '%s' "$PASSWORD" > amp-db-password)
  #   kubectl create secret generic amp-db --from-file=password=amp-db-password
  # With environment=production AMP requires a password of 12+ characters.
  # The password is read at pod start: after changing the Secret, run
  # kubectl rollout restart statefulset/<fullname>.
  existingSecret: ""
  existingSecretPasswordKey: password

# ===============================
# External Secrets Operator (TN-100: Production Security)
# ===============================
# Enable External Secrets Operator for production secret management
# Integrates with AWS Secrets Manager, GCP Secret Manager, Azure Key Vault, HashiCorp Vault
externalSecrets:
  enabled: false  # Set to true in production with ESO installed
  secretStore: "default"  # Name of SecretStore or ClusterSecretStore
  secretStoreKind: "SecretStore"  # SecretStore or ClusterSecretStore
  refreshInterval: "1h"  # How often to sync secrets
  keyPath: "alertmanager-plus-plus"  # Path in secret manager

# ===============================
# Valkey StatefulSet Configuration (<fullname>-redis)
# ===============================
# The chart's one in-cluster cache, Standard Profile only. Valkey (BSD-3), not
# Redis: Redis >= 7.4 is RSALv2/SSPL (ADR-017). amp-upstream does not connect
# to it yet: it is kept for the cross-replica investigation dedup
# (UPSTREAM-AI-HA-DEDUP), so it is off by default. valkey.enabled: true renders
# its StatefulSet, Services, Secret, ServiceMonitor and alert rules;
# valkey.replicas: 0 then stops the pod and keeps the rest (HELM-CHART-GAPS).
valkey:
  enabled: false  # Off: amp-upstream does not use Valkey yet

  # Deployment configuration
  replicas: 1  # Expandable to 3 for Sentinel HA in future

  # Container image. Valkey 8.1 cannot load data written by Redis >= 7.4
  # (RDB v12): when repository contains "valkey", the init container moves
  # such files to /data/redis-pre-valkey-<ts>/ and Valkey starts without them
  # (CHANGELOG migration notes). A Valkey mirror under another name skips the
  # move; set repository and tag together.
  image:
    repository: valkey/valkey
    tag: "8.1.10-alpine"
    pullPolicy: IfNotPresent

  # Idle/light load measured at ~10m CPU / ~5Mi; the limit bounds maxmemory below.
  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 50m
      memory: 64Mi

  # Persistence (TN-99: enabled for durability)
  storage:
    className: ""
    requestedSize: 5Gi

  # Valkey settings
  settings:
    maxmemory: 384mb  # 75% of 512Mi limit (leaves headroom for overhead)
    maxmemoryPolicy: allkeys-lru  # Evict least recently used keys
    appendonly: "yes"  # AOF persistence enabled (write-ahead log)
    appendfsync: everysec  # Fsync every 1s (balance performance/durability, <1s data loss)
    loglevel: notice  # Options: debug, verbose, notice, warning
    slowlogThreshold: 10000  # Log queries >10ms (microseconds)

  # redis-exporter Sidecar (Prometheus metrics)
  exporter:
    enabled: true
    image: quay.io/oliver006/redis_exporter
    tag: v1.55.0
    pullPolicy: IfNotPresent
    resources:
      limits:
        cpu: 100m
        memory: 128Mi
      requests:
        cpu: 10m
        memory: 32Mi

  # Password authentication (Secret management). Valkey and its exporter read
  # the same Secret.
  password:
    # Use existing Secret (recommended for production)
    existingSecret: ""  # If empty, creates <fullname>-redis-secret
    secretKey: password  # Key of the password in existingSecret
    # Password value (only used if existingSecret is empty)
    # In production: Set via Helm values or External Secrets Operator (TN-100)
    # If empty: generated on first install, kept by later upgrades (lookup).
    # Renders without cluster access (helm template, client-side --dry-run,
    # Argo CD) cannot look the Secret up and generate a new one each time:
    # set value or existingSecret there. An existingSecret password must not
    # end with a newline: Valkey trims it, the exporter does not:
    #   (umask 077; printf '%s' "$PASSWORD" > valkey-password)
    #   kubectl create secret generic amp-valkey --from-file=password=valkey-password
    value: ""

  # NetworkPolicy (pod isolation)
  networkPolicy:
    enabled: false  # Enable in production for security hardening

# ===============================
# LLM Configuration
# ===============================
# Classification of every firing alert (and, with investigation.enabled, its
# investigation). With alertmanager.replicas > 1 every pod classifies every
# alert: N LLM calls per alert until UPSTREAM-AI-HA-DEDUP.
llm:
  # Off by default: there is no key to use. To enable, set enabled=true and
  # either apiKey or externalSecrets.enabled (llm_api_key in the store);
  # otherwise the render fails.
  enabled: false
  provider: "openai"
  proxyUrl: "https://llm-proxy.example.com"  # llm.base_url
  apiKey: ""  # Set via local override, environment, or secret; never commit real keys
  model: "openai/gpt-4o"
  timeout: 30  # seconds, or a Go duration ("30s")
  maxRetries: 3
  # Agentic investigation loop (tools, runbooks) instead of a single LLM call.
  agentMode: false
  # How long a notification waits for the alert's classification before it
  # goes out without it.
  notifyWait: 5s
  # Drop notifications for alerts classified as noise.
  dropNoise: false

  # LLM API Key Secret (prefer external secrets in production)
  secret:
    enabled: false
    name: "llm-api-key"
    key: "api-key"

  # External secrets configuration
  externalSecrets:
    enabled: false
    secretStore: ""
    secretName: ""
    secretKey: "api-key"

# ===============================
# Investigation Pipeline (PHASE-5A / 5B)
# ===============================
# Async LLM-driven alert investigation.
# Requires: profile=standard, Postgres, llm.enabled=true. Tools and runbooks
# (llm.agentMode) are configured with alertmanager.ampConfig.
investigation:
  enabled: false
  workerCount: 3
  queueSize: 500
  maxRetries: 3
  retryInterval: 5s
  llmTimeout: 60s
  onlyFiring: true  # false has no effect on amp-upstream: only firing alerts are investigated

# ===============================
# Monitoring Configuration
# ===============================
monitoring:
  prometheusEnabled: true
  # ServiceMonitors and PrometheusRules render only when the cluster serves
  # monitoring.coreos.com/v1 (prometheus-operator CRDs); otherwise they are
  # skipped and NOTES.txt says so. `helm template` without a cluster does not
  # see the CRDs: pass --api-versions monitoring.coreos.com/v1 or set this to
  # true. Argo CD and Flux pass the cluster's API versions themselves.
  assumeCRDs: false
  # ServiceMonitor for AMP itself (prometheus-operator). Rendered only when
  # prometheusEnabled is also true. Scrapes /metrics on the `web` port of
  # every pod.
  serviceMonitor:
    enabled: true
    interval: 30s
    scrapeTimeout: 10s
    # Extra labels on the ServiceMonitor, e.g. what the Prometheus
    # serviceMonitorSelector matches on (release: kube-prometheus-stack).
    labels: {}
    # With webConfig.existingSecret, /metrics requires credentials and the chart
    # refuses to render a ServiceMonitor without them (it would only ever get
    # 401). The Secret lives in the release namespace and holds the PLAIN
    # username/password of a web-config user, not the bcrypt hash:
    #   kubectl create secret generic amp-metrics-auth \
    #     --from-literal=username=prometheus --from-literal=password=...
    basicAuth:
      secretName: ""
      usernameKey: username
      passwordKey: password
  # Extra labels on the chart's PrometheusRules (PostgreSQL, and Valkey when
  # enabled), e.g. what the Prometheus ruleSelector matches on:
  # kube-prometheus-stack selects rules by `release: <its release name>` and
  # silently ignores the rest. serviceMonitor.labels also lands on the Valkey
  # ServiceMonitor.
  prometheusRule:
    labels: {}

# ===============================
# Alert Publishing Configuration
# ===============================
# K8s-Secret publishing targets (label publishing.discovery.labelSelector,
# JSON in data.config): appended as integrations to the receivers of
# alertmanager.config on every reload. Profile standard only.
publishing:
  enabled: true
  discovery:
    namespace: ""  # Empty: the release namespace
    labelSelector: "publishing-target=true"
  refresh:
    interval: "5m"  # How often the Secrets are listed

# ===============================
# Rootly Integration (Priority)
# ===============================
rootly:
  enabled: false  # Set to true to enable Rootly integration

  # Rootly API configuration
  webhookUrl: ""  # Rootly webhook URL (required)
  apiKey: ""      # Rootly API key (prefer external secrets)
  authToken: ""   # Optional auth token
  orgId: ""       # Rootly organization ID

  # Custom headers for Rootly API
  customHeaders: {}
    # X-Custom-Header: "value"

  # Incident management settings
  incidentSettings:
    autoCreate: true          # Auto-create incidents from critical alerts
    severity: "high"          # Default incident severity
    assignTeam: ""            # Default team assignment
    tags: []                  # Default incident tags
      # - "kubernetes"
      # - "production"

  # Rootly-specific filtering
  filterConfig:
    severity: ["critical", "warning"]     # Only forward critical/warning alerts
    namespaces: ["production"]            # Production namespace only
    excludeNoise: true                    # Exclude noisy alerts
    minConfidence: 0.8                    # High confidence threshold
    alertNamePattern: ""                  # Optional regex pattern

    # Rootly-specific filters
    incidentTypes: ["infrastructure", "application"]  # Incident types
    services: []              # Target specific services
      # - "api-gateway"
      # - "database"
    environments: ["production"]  # Target environments

# ===============================
# Publishing Targets (Examples)
# ===============================
publishingTargets: []
# Example configuration for dynamic publishing targets:
# publishingTargets:
#   # Rootly integration
#   - name: rootly-production
#     type: rootly
#     format: rootly
#     url: https://api.rootly.com/v1/incidents
#     enabled: true
#     secret:
#       apiKey: "your-rootly-api-key"
#     filterConfig:
#       severity: ["critical", "warning"]
#       excludeNoise: true
#       minConfidence: 0.7
#       namespaces: ["production"]
#
#   # PagerDuty integration
#   - name: pagerduty-oncall
#     type: pagerduty
#     format: pagerduty
#     url: https://events.pagerduty.com/v2/enqueue
#     enabled: true
#     secret:
#       routingKey: "your-pagerduty-routing-key"
#     filterConfig:
#       severity: ["critical"]
#       excludeNoise: true
#       minConfidence: 0.8
#
#   # Slack notifications
#   - name: slack-alerts
#     type: slack
#     format: slack
#     url: https://hooks.slack.com/your-webhook-url
#     enabled: true
#     secret:
#       token: "your-slack-token"
#     filterConfig:
#       severity: ["critical", "warning"]
#       namespaces: ["production", "staging"]
#       alertNamePattern: "^(HighCPU|HighMemory|DiskSpace).*"
#
#   # Generic webhook example
#   - name: custom-webhook
#     type: webhook
#     format: alertmanager
#     url: https://your-webhook-endpoint.com/alerts
#     enabled: false
#     secret:
#       apiKey: "your-api-key"
#       customHeaders:
#         X-Auth-Token: "bearer-token"
#         X-Source: "amp"
#     filterConfig:
#       severity: ["critical", "warning", "info"]
#       excludeNoise: false

# Extra volumes for the pod and mounts for the `amp` container. Main use:
# receiver credentials from a Secret you create, so alertmanager.config (a
# ConfigMap) holds file paths instead of tokens. Also: a ConfigMap with
# runbooks (investigation.runbooks.path in alertmanager.ampConfig).
#
# - `*_file` paths in alertmanager.config must be ABSOLUTE.
# - amp-upstream reads the files on every config load. After changing the
#   Secret, wait for kubelet to sync the volume (about a minute), then POST
#   /-/reload to every pod or `kubectl rollout restart`. Volumes mounted with
#   subPath are never updated.
# - A name or mountPath already used by the chart fails the render: volumes
#   config, data, web-config (webConfig.existingSecret) and their mount paths
#   (/etc/amp/config, /data, webConfig.mountPath), plus the files in them. A
#   path next to them, e.g. /etc/amp/secrets, is fine.
# - With the default podSecurityContext (runAsUser/fsGroup 65534) Secret files
#   stay readable with a strict defaultMode such as 0440. Without fsGroup keep
#   the default mode.
extraVolumes: []
# extraVolumes:
#   - name: receiver-secrets
#     secret:
#       secretName: amp-receiver-secrets   # keys: telegram-bot-token, slack-webhook-url
#       defaultMode: 0440
extraVolumeMounts: []

# Extra env for the amp container, after the chart's own (EnvVar list), for
# secrets the AMP configuration reads from env, e.g.:
# extraEnv:
#   - name: INVESTIGATION_TOOLS_DATABASE_DSN
#     valueFrom:
#       secretKeyRef: {name: amp-investigation-db, key: dsn}
extraEnv: []
# extraVolumeMounts:
#   - name: receiver-secrets
#     mountPath: /etc/amp/secrets
#     readOnly: true
#
# and in alertmanager.config:
#   receivers:
#     - name: telegram-panic
#       telegram_configs:
#         - bot_token_file: /etc/amp/secrets/telegram-bot-token
#           chat_id: -1001234567890
#     - name: slack
#       slack_configs:
#         - api_url_file: /etc/amp/secrets/slack-webhook-url
#           channel: '#alerts'

# ===============================
# Scheduling Configuration
# ===============================
nodeSelector: {}

tolerations: []

affinity:
  podAntiAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
    - weight: 100
      podAffinityTerm:
        labelSelector:
          matchExpressions:
          - key: app.kubernetes.io/name
            operator: In
            values:
            - amp
          # Only the AMP pods: postgres and Valkey share the name label.
          - key: app.kubernetes.io/component
            operator: In
            values:
            - application
        topologyKey: kubernetes.io/hostname

# ===============================
# Alertmanager core (amp-upstream, ADR-019)
# ===============================
# The chart's one workload: a StatefulSet running upstream Alertmanager
# (api/v2, silences, inhibition, routing, notifications) with AMP's layer on
# top (alert history, classification, investigation, K8s-Secret targets).
alertmanager:
  # 1: no gossip cluster (--cluster.listen-address=). > 1: the pods form an
  # upstream memberlist cluster over <fullname>-headless (gossip on 9094
  # TCP+UDP): silences and the notification log are replicated, every pod
  # must receive every alert (Prometheus: list all pods, not the Service),
  # and a notification goes out once. Gossip is plain TCP/UDP unless
  # extraArgs sets --cluster.tls-config.
  replicas: 1
  # --web.external-url; empty: http://<fullname>.<namespace>.svc:9093/.
  # Its path prefixes every endpoint, probes included. Links in
  # notifications (silence URLs) point here.
  externalURL: ""
  # --cluster.peer-timeout: how long each pod waits per peer ahead of it
  # before notifying (upstream default).
  peerTimeout: 15s
  # alertmanager.yml, as upstream Alertmanager reads it. A change rolls the
  # pods (checksum/config).
  config:
    route:
      receiver: default
    receivers:
      - name: default
  # Merged over the AMP configuration the chart generates from profile,
  # environment, database, llm, investigation and publishing
  # (<fullname>-amp-config, --amp.config.file), e.g.
  #   investigation:
  #     tools: {...}
  #     runbooks: {enabled: true, path: /etc/amp/runbooks}
  #   server:
  #     auth:
  #       unauthenticated_paths: [/-/healthy, /-/ready, /metrics]
  # No secrets here: it is a ConfigMap. The chart sets DATABASE_PASSWORD and
  # LLM_API_KEY from Secrets; others go to extraEnv, e.g.
  # INVESTIGATION_TOOLS_DATABASE_DSN for the agent-mode database tool. The
  # Prometheus and Loki tool passwords are read from the file only: put them
  # here only if a ConfigMap is acceptable for them.
  ampConfig: {}
  # Silence and notification-log snapshots (--storage.path=/data), one
  # volume per pod via volumeClaimTemplates. Not removed with the release.
  persistence:
    size: 1Gi
    storageClass: ""
    accessMode: ReadWriteOnce
  # Extra amp-upstream flags, e.g. --cluster.tls-config=..., --cluster.label=...
  extraArgs: []
