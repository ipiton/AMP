# Development-oriented values overrides for AMP with optional LLM settings
# Usage: helm install amp ./helm/amp -f values-dev.yaml

# ===============================
# Application Configuration
# ===============================
environment: development

# ===============================
# Container Image Configuration
# ===============================
image:
  repository: ghcr.io/ipiton/amp
  tag: "latest"
  pullPolicy: Always

# ===============================
# Resource Configuration (Development)
# ===============================
resources:
  limits:
    cpu: 1000m
    memory: 1Gi
  requests:
    cpu: 500m
    memory: 512Mi

# ===============================
# Database Configuration (bundled PostgreSQL, dev/pilot only — ADR-016)
# ===============================
# Alert history and investigations need PostgreSQL (profile standard). For
# the core alone use profile: lite.
postgresql:
  enabled: true

# ===============================
# LLM Configuration (Development)
# ===============================
llm:
  # Off until a key is supplied: enabled=true needs apiKey, or the render fails.
  enabled: false
  proxyUrl: "https://llm-proxy.example.com"
  apiKey: ""  # Set via local override or secret; never commit real keys
  model: "openai/gpt-4o"
  timeout: 30
  maxRetries: 3

# ===============================
# Publishing Targets (Development)
# ===============================
publishingTargets:
  # Test webhook target
  - name: test-webhook
    type: webhook
    format: alertmanager
    url: "http://localhost:8081/test-webhook"
    enabled: false
    secret:
      apiKey: "test-api-key"
    filterConfig:
      severity: ["critical", "warning", "info"]
      excludeNoise: false

# ===============================
# Monitoring Configuration
# ===============================
monitoring:
  prometheusEnabled: true

# ===============================
# Ingress Configuration (Disabled for development)
# ===============================
ingress:
  enabled: false

# ===============================
# Service Configuration (NodePort for development)
# ===============================
service:
  type: NodePort

# ===============================
# Security Configuration (Relaxed for development)
# ===============================
podSecurityContext:
  fsGroup: 65534
  runAsNonRoot: false
  runAsUser: 0

securityContext:
  allowPrivilegeEscalation: true
  capabilities:
    drop: []
  readOnlyRootFilesystem: false
  runAsNonRoot: false
  runAsUser: 0
