# Production-oriented values overrides for AMP with optional LLM settings
# Usage:
#   helm install amp ./helm/amp -f values-production.yaml
#
# Every key below was audited against the AMP configuration
# (go-app/internal/config/config.go) and the chart's own templates
# (UPSTREAM-CORE-REMOVAL, 2026-11).

# ===============================
# Application Configuration
# ===============================
environment: production
profile: "standard"

# ===============================
# Container Image Configuration
# ===============================
image:
  repository: ghcr.io/ipiton/amp
  tag: ""            # defaults to .Chart.AppVersion
  pullPolicy: Always

# ===============================
# Resource Configuration
# ===============================
resources:
  limits:
    cpu: 2000m
    memory: 2Gi
  requests:
    cpu: 1000m
    memory: 1Gi

# ===============================
# Alertmanager core (HA)
# ===============================
# Three pods in one gossip cluster: silences and the notification log are
# replicated, a notification goes out once. Prometheus must send every alert
# to every pod (<fullname>-<i>.<fullname>-headless:9093), not to the Service.
# With llm.enabled every pod classifies every alert: 3 LLM calls per alert
# until UPSTREAM-AI-HA-DEDUP.
alertmanager:
  replicas: 3
  # Deliberately secret-free: alertmanager.yml lands in a plain ConfigMap.
  # Real delivery targets come from Kubernetes Secrets (publishing discovery,
  # appended to these receivers) or from *_file paths on extraVolumes.
  config:
    route:
      receiver: default
      group_by: ['alertname', 'cluster', 'service']
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 4h
    receivers:
      # No integrations = a blackhole receiver until targets are attached.
      - name: default
  persistence:
    size: 2Gi

# ===============================
# Pod Disruption Budget (AMP StatefulSet)
# ===============================
podDisruptionBudget:
  enabled: true
  minAvailable: 2 # alertmanager.replicas 3 — never drain below 2 on voluntary disruption

# ===============================
# PostgreSQL Database (Production): external
# ===============================
# Production runs on an external PostgreSQL >= 16 with backups/PITR (ADR-016).
# The bundled one (templates/postgresql-statefulset.yaml) is a single primary
# with no replication, failover or backups: dev/pilot only, so it is off here.
#
# This file does not render until externalDatabase.host, database, username
# and existingSecret are set (a Secret you create; the chart never does), the
# same way it refuses to render without webConfig.existingSecret. See README
# "PostgreSQL".
#
# MIGRATION: before 2026-10 this file installed the bundled PostgreSQL. A
# `helm upgrade` of such a release with this file removes the bundled
# StatefulSet (its PVC stays) and points AMP at the external database, which
# starts EMPTY. Move the data first: CHANGELOG [Unreleased] and
# helm/amp/docs/POSTGRESQL_RESTORE_GUIDE.md § 3c. To stay on the bundled
# database for now, keep your previous `postgresql:` block (it is not the
# base values.yaml one: password, 50Gi volume, resources, networkPolicy).
#
# Connections: 25 per pod (database.max_connections default) × 3 replicas
# = up to 75. Size max_connections on the server for that.
postgresql:
  enabled: false

externalDatabase:
  host: ""
  port: 5432
  database: ""
  username: ""
  sslMode: require # "disable" is refused by AMP under environment=production
  existingSecret: ""
  existingSecretPasswordKey: password

# amp-upstream does not use Valkey yet (UPSTREAM-AI-HA-DEDUP): no pod.
valkey:
  replicas: 0

# ===============================
# LLM Configuration (Production)
# ===============================
llm:
  # Off until a key is supplied: enabled=true needs apiKey or
  # externalSecrets.enabled (llm_api_key in the store), or the render fails.
  enabled: false
  proxyUrl: "https://llm-proxy.example.com"
  apiKey: "" # Set via secret or external secrets
  model: "openai/gpt-4o"
  timeout: 30
  maxRetries: 3

  externalSecrets:
    enabled: true
    secretStore: "vault-backend"
    secretName: "amp-llm-api-key"
    secretKey: "api-key"

# ===============================
# Publishing Runtime (Production)
# ===============================
publishing:
  enabled: true
  discovery:
    namespace: monitoring
    labelSelector: "publishing-target=true"
  refresh:
    interval: "5m"

# `publishingTargets` is the Helm input shape.
# The chart serializes each entry into a canonical runtime Secret:
#   label: publishing-target=true
#   data.config: <base64 JSON core.PublishingTarget>
publishingTargets:
  # Rootly integration for production
  - name: rootly-production
    type: rootly
    format: rootly
    url: "https://api.rootly.com/webhooks/your-webhook-id"
    enabled: true
    secret:
      apiKey: "" # Set via external secrets
    filterConfig:
      severity: ["critical", "warning"]
      excludeNoise: true
      minConfidence: 0.8
      namespaces: ["production", "staging"]

  # PagerDuty integration
  - name: pagerduty-oncall
    type: pagerduty
    format: pagerduty
    url: "https://events.pagerduty.com/v2/enqueue"
    enabled: true
    secret:
      routingKey: "" # Set via external secrets
    filterConfig:
      severity: ["critical"]
      excludeNoise: true
      minConfidence: 0.9

  # Slack notifications
  - name: slack-alerts
    type: slack
    format: slack
    url: "https://hooks.slack.com/your-webhook-url"
    enabled: true
    secret:
      token: "" # Set via external secrets
    filterConfig:
      severity: ["critical", "warning"]
      namespaces: ["production"]

# ===============================
# Monitoring Configuration
# ===============================
monitoring:
  prometheusEnabled: true
  healthCheckInterval: 30
  # With webConfig.existingSecret set (see ingress below), the ServiceMonitor
  # needs credentials or the render fails: set
  # serviceMonitor.basicAuth.secretName (Secret with the plain username and
  # password, see values.yaml). Its Prometheus must also be listed in
  # networkPolicy.metricsScrapers below, or scrapes time out.
  serviceMonitor:
    enabled: true

# ===============================
# Ingress Configuration (Production)
# ===============================
# PROD-INGRESS-HARDENING (ADR-015): the render fails until the API behind this
# Ingress is protected. Either
#   - webConfig.existingSecret: <Secret with web-config.yml> (in-process basic
#     auth, see values.yaml `webConfig`), or
#   - ingress.externalAuth: true, together with the auth annotations of your
#     controller (oauth2-proxy / nginx auth-url, auth-secret).
ingress:
  enabled: true
  externalAuth: false
  className: "nginx"
  annotations:
    kubernetes.io/ingress.class: nginx
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
  hosts:
    - host: amp.your-domain.com
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: amp-tls
      hosts:
        - amp.your-domain.com

# ===============================
# NetworkPolicy (Production)
# ===============================
# Enabled, with NO default sources: the render fails until you name yours. A
# guessed default (namespace "ingress-nginx", "monitoring") that misses would
# drop alerts silently; a failed render does not. Semantics, ipBlock and the
# kill-switch: values.yaml `networkPolicy`.
networkPolicy:
  enabled: true
  ingressController: []
  #  - namespaceSelector:
  #      matchLabels:
  #        kubernetes.io/metadata.name: ingress-nginx
  #    podSelector:
  #      matchLabels:
  #        app.kubernetes.io/name: ingress-nginx
  alertSenders: []
  #  - namespaceSelector:
  #      matchLabels:
  #        kubernetes.io/metadata.name: monitoring
  #    podSelector:
  #      matchLabels:
  #        app.kubernetes.io/name: prometheus
  metricsScrapers: []
  #  - namespaceSelector:
  #      matchLabels:
  #        kubernetes.io/metadata.name: monitoring
  #    podSelector:
  #      matchLabels:
  #        app.kubernetes.io/name: prometheus
  extraIngress: []

# ===============================
# Security Configuration
# ===============================
# GET /api/v2/status masks the secrets of alertmanager.yml and of the attached
# K8s-Secret targets as upstream masks them; nothing to set here for that.
podSecurityContext:
  fsGroup: 65534
  runAsNonRoot: true
  runAsUser: 65534

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
    - ALL
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  runAsUser: 65534

# ===============================
# Node Affinity (Production)
# ===============================
# nodeAffinity is PREFERRED, not required: a `required` rule against a node
# label your cluster hasn't set leaves every pod Pending with no signal beyond
# "0/N nodes match" — set this to `requiredDuringSchedulingIgnoredDuringExecution`
# once `node-role.kubernetes.io/production=true` is actually labelled on your nodes.
affinity:
  podAntiAffinity:
    requiredDuringSchedulingIgnoredDuringExecution:
    - labelSelector:
        matchExpressions:
        - key: app.kubernetes.io/name
          operator: In
          values:
          - amp
        - key: app.kubernetes.io/component
          operator: In
          values:
          - application
      topologyKey: kubernetes.io/hostname
  nodeAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
    - weight: 50
      preference:
        matchExpressions:
        - key: node-role.kubernetes.io/production
          operator: In
          values:
          - "true"
