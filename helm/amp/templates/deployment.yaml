apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "amp.fullname" . }}
  namespace: {{ .Values.namespace | default .Release.Namespace }}
  labels:
    {{- include "amp.labels" . | nindent 4 }}
  annotations:
    deployment.kubernetes.io/revision: "1"
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "amp.selectorLabels" . | nindent 6 }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: {{ .Values.strategy.maxUnavailable | default "25%" }}
      maxSurge: {{ .Values.strategy.maxSurge | default "25%" }}
  template:
    metadata:
      labels:
        {{- include "amp.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- if .Values.configReloader.enabled }}
      {{- if not .Values.configFile.enabled }}
      {{- fail "configReloader.enabled=true requires configFile.enabled=true: the sidecar watches a config FILE, and without one it would poll a path that does not exist." }}
      {{- end }}
      {{- if and (eq .Values.configReloader.method "signal") (not .Values.configReloader.shareProcessNamespace) }}
      {{- fail "configReloader.method=signal requires configReloader.shareProcessNamespace=true, otherwise the sidecar is its own PID 1 and SIGHUP would never reach AMP. Use method: http instead." }}
      {{- end }}
      {{- end }}
      {{- if and .Values.configReloader.enabled .Values.configReloader.shareProcessNamespace }}
      # Only set for configReloader.method=signal: it lets every container in
      # the pod see the others' processes, which is the price of SIGHUP across
      # a container boundary.
      shareProcessNamespace: true
      {{- end }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "amp.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      terminationGracePeriodSeconds: {{ .Values.gracefulShutdown.terminationGracePeriodSeconds | default 30 }}
      containers:
        - name: amp
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
              protocol: TCP
            - name: metrics
              containerPort: {{ .Values.service.metricsPort | default 9090 }}
              protocol: TCP
          env:
            # Application Configuration
            - name: SERVICE_NAME
              value: {{ include "amp.fullname" . }}
            - name: SERVICE_VERSION
              value: {{ .Chart.AppVersion | quote }}

            # Database Configuration
            {{- if and .Values.postgresql.enabled (eq .Values.profile "standard") }}
            - name: DATABASE_HOST
              value: {{ include "amp.postgresql.fullname" . }}
            - name: DATABASE_PORT
              value: "5432"
            - name: DATABASE_DATABASE
              value: {{ .Values.postgresql.database | quote }}
            - name: DATABASE_USERNAME
              value: {{ .Values.postgresql.username | quote }}
            - name: DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "amp.postgresql.secretName" . }}
                  key: password
            - name: DATABASE_SSL_MODE
              value: {{ ternary "require" "disable" (eq (default "off" .Values.postgresql.config.ssl) "on") | quote }}
            {{- else }}
            - name: STORAGE_FILESYSTEM_PATH
              value: {{ printf "%s/alerthistory.db" .Values.liteProfile.persistence.mountPath | quote }}
            {{- end }}

            # Valkey/Redis Configuration (Standard Profile Only)
            {{- if and .Values.cache.enabled (eq .Values.profile "standard") }}
            - name: REDIS_ADDR
              value: {{ printf "%s:%v" (tpl .Values.cache.host .) .Values.cache.port | quote }}
            {{- if .Values.cache.auth.enabled }}
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "amp.fullname" . }}-secrets
                  key: redis-password
            {{- end }}
            {{- else }}
            - name: REDIS_ADDR
              value: "localhost:6379"
            {{- end }}

            # LLM Configuration
            {{- if .Values.llm.enabled }}
            - name: LLM_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "amp.fullname" . }}-secrets
                  key: llm-api-key
            {{- end }}

            # Publishing Configuration
            {{- if .Values.publishing.discovery.namespace }}
            - name: PUBLISHING_DISCOVERY_NAMESPACE
              value: {{ .Values.publishing.discovery.namespace | quote }}
            {{- else }}
            - name: PUBLISHING_DISCOVERY_NAMESPACE
              valueFrom:
                fieldRef:
                  apiVersion: v1
                  fieldPath: metadata.namespace
            {{- end }}

            # Server Configuration
            - name: SERVER_HOST
              value: "0.0.0.0"
            - name: SERVER_PORT
              value: {{ .Values.service.port | quote }}
            {{- if .Values.server.externalUrl }}
            - name: SERVER_EXTERNAL_URL
              value: {{ .Values.server.externalUrl | quote }}
            {{- end }}
            - name: LOG_LEVEL
              value: {{ .Values.logLevel | quote }}
            {{- if .Values.configFile.enabled }}
            # Points AMP at the mounted config FILE. Without this the process
            # looks for ./config.yaml, finds nothing, and runs on env vars only —
            # so route:/receivers: would be silently absent.
            - name: AMP_CONFIG_FILE
              value: {{ printf "%s/%s" .Values.configFile.mountPath .Values.configFile.fileName | quote }}
            {{- end }}

          envFrom:
            - configMapRef:
                name: {{ include "amp.fullname" . }}-config
                optional: true

          livenessProbe:
            httpGet:
              path: {{ .Values.probes.liveness.path | default "/healthz" }}
              port: http
              scheme: HTTP
            initialDelaySeconds: {{ .Values.probes.liveness.initialDelaySeconds | default 30 }}
            periodSeconds: {{ .Values.probes.liveness.periodSeconds | default 10 }}
            timeoutSeconds: {{ .Values.probes.liveness.timeoutSeconds | default 5 }}
            failureThreshold: {{ .Values.probes.liveness.failureThreshold | default 3 }}
            successThreshold: 1

          readinessProbe:
            httpGet:
              path: {{ .Values.probes.readiness.path | default "/readyz" }}
              port: http
              scheme: HTTP
            initialDelaySeconds: {{ .Values.probes.readiness.initialDelaySeconds | default 10 }}
            periodSeconds: {{ .Values.probes.readiness.periodSeconds | default 5 }}
            timeoutSeconds: {{ .Values.probes.readiness.timeoutSeconds | default 10 }}
            failureThreshold: {{ .Values.probes.readiness.failureThreshold | default 3 }}
            successThreshold: 1

          startupProbe:
            httpGet:
              path: {{ .Values.probes.startup.path | default "/healthz" }}
              port: http
              scheme: HTTP
            initialDelaySeconds: {{ .Values.probes.startup.initialDelaySeconds | default 10 }}
            periodSeconds: {{ .Values.probes.startup.periodSeconds | default 10 }}
            timeoutSeconds: {{ .Values.probes.startup.timeoutSeconds | default 5 }}
            failureThreshold: {{ .Values.probes.startup.failureThreshold | default 30 }}
            successThreshold: 1

          resources:
            {{- toYaml .Values.resources | nindent 12 }}

          # Graceful shutdown: rely on SIGTERM handling in application
          # No preStop hook needed - our app handles SIGTERM properly

          {{- if or (eq .Values.profile "lite") .Values.configFile.enabled }}
          volumeMounts:
            {{- if eq .Values.profile "lite" }}
            - name: data
              mountPath: {{ .Values.liteProfile.persistence.mountPath }}
            {{- end }}
            {{- if .Values.configFile.enabled }}
            - name: config-file
              mountPath: {{ .Values.configFile.mountPath }}
              readOnly: true
            {{- end }}
          {{- end }}

{{- if .Values.configReloader.enabled }}
        # ----------------------------------------------------------------------
        # config-reloader sidecar (INF-A slice 2)
        # ----------------------------------------------------------------------
        # Watches the mounted config file and asks AMP to reload when its
        # CONTENT changes, then VERIFIES the reload against /health/reload — so
        # a ConfigMap edit AMP rejects shows up as rejected instead of being
        # silently counted as applied.
        - name: config-reloader
          image: "{{ .Values.configReloader.image.repository }}:{{ .Values.configReloader.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.configReloader.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.configReloader.securityContext | nindent 12 }}
          args:
            - --config-file={{ printf "%s/%s" .Values.configFile.mountPath .Values.configFile.fileName }}
            - --interval={{ .Values.configReloader.interval }}
            - --method={{ .Values.configReloader.method }}
            {{- if eq .Values.configReloader.method "signal" }}
            - --pid={{ .Values.configReloader.pid }}
            {{- else }}
            # 127.0.0.1: same pod, same network namespace. Never the Service —
            # a reload must hit THIS replica, not a random one.
            - --reload-url=http://127.0.0.1:{{ .Values.service.port }}/-/reload
            {{- end }}
            - --health-url=http://127.0.0.1:{{ .Values.service.port }}/health/reload
            - --metrics-addr=:{{ .Values.configReloader.metricsPort }}
            - --verify-timeout={{ .Values.configReloader.verifyTimeout }}
            - --max-backoff={{ .Values.configReloader.maxBackoff }}
            - --log-level={{ .Values.configReloader.logLevel }}
            - --log-format={{ .Values.configReloader.logFormat }}
          ports:
            - name: reloader
              containerPort: {{ .Values.configReloader.metricsPort }}
              protocol: TCP
          livenessProbe:
            # The sidecar's OWN health, not the application's: a failing reload
            # must not restart this container (it would lose its backoff state
            # and retry immediately, which is the opposite of what we want).
            httpGet:
              path: /healthz
              port: reloader
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            {{- toYaml .Values.configReloader.resources | nindent 12 }}
          volumeMounts:
            - name: config-file
              mountPath: {{ .Values.configFile.mountPath }}
              readOnly: true
{{- end }}

      {{- if or (eq .Values.profile "lite") .Values.configFile.enabled }}
      volumes:
        {{- if eq .Values.profile "lite" }}
        - name: data
          persistentVolumeClaim:
            claimName: {{ include "amp.fullname" . }}-pvc
        {{- end }}
        {{- if .Values.configFile.enabled }}
        - name: config-file
          configMap:
            name: {{ include "amp.fullname" . }}-configfile
        {{- end }}
      {{- end }}

      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
