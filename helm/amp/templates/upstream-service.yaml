{{- if .Values.upstreamCore.enabled }}
{{- /* API of the upstream core (api/v2, /-/*, /metrics). */}}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "amp.upstream.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "amp.upstream.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - name: web
      port: 9093
      targetPort: web
      protocol: TCP
  selector:
    {{- include "amp.upstream.selectorLabels" . | nindent 4 }}
{{- end }}
