{{- if .Values.postgresql.enabled }}
{{- /* ADR-016: the bundled PostgreSQL is a single instance for dev/pilot. */}}
{{- if and (hasKey .Values.postgresql "replicas") (ne (int .Values.postgresql.replicas) 1) }}
{{- fail "postgresql.replicas must be 1: the bundled PostgreSQL has no replication, so every extra replica is a separate empty database behind the same Service and AMP's writes would be split between them. For high availability use an external PostgreSQL (ADR-016, helm/amp/README.md#postgresql); to run without the bundled one set postgresql.enabled=false." }}
{{- end }}
{{- $backup := .Values.postgresql.backup }}
{{- if or (eq (toString $backup) "true") (and (kindIs "map" $backup) (eq (toString (dig "enabled" false $backup)) "true")) }}
{{- fail "postgresql.backup was removed: the bundled backup CronJob never produced a backup (its replication connection was rejected) and WAL archiving was never on. Backups are the operator's responsibility (ADR-016); see helm/amp/docs/POSTGRESQL_RESTORE_GUIDE.md for a pg_dump/pg_restore runbook. Remove postgresql.backup from your values. Upgrading with --reuse-values carries the old chart default (backup.enabled: true): use --reset-then-reuse-values, or add --set postgresql.backup.enabled=false." }}
{{- end }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "amp.postgresql.fullname" . }}
  namespace: {{ .Values.namespace | default .Release.Namespace }}
  labels:
    {{- include "amp.labels" . | nindent 4 }}
    app.kubernetes.io/component: database
  annotations:
    description: "Bundled single-instance PostgreSQL for dev/pilot; no replication, no backups. Production: external PostgreSQL (ADR-016)."
spec:
  serviceName: {{ include "amp.postgresql.fullname" . }}
  replicas: 1
  podManagementPolicy: OrderedReady
  updateStrategy:
    type: RollingUpdate
  selector:
    matchLabels:
      {{- include "amp.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: database
  template:
    metadata:
      labels:
        {{- include "amp.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: database
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/postgresql-configmap.yaml") . | sha256sum }}
        checksum/secret: {{ include (print $.Template.BasePath "/postgresql-secret.yaml") . | sha256sum }}
        prometheus.io/scrape: "true"
        prometheus.io/port: "9187"
        prometheus.io/path: "/metrics"
    spec:
      securityContext:
        fsGroup: 999
        supplementalGroups:
        - 999
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      {{- if .Values.postgresql.affinity }}
      affinity:
        {{- toYaml .Values.postgresql.affinity | nindent 8 }}
      {{- else }}
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                - key: app.kubernetes.io/component
                  operator: In
                  values:
                  - database
              topologyKey: kubernetes.io/hostname
      {{- end }}
      containers:
      - name: postgres
        image: postgres:16.15
        imagePullPolicy: IfNotPresent
        {{- if .Values.postgresql.config }}
        # Server arguments, not initdb ones: they apply on every start, also on an
        # already initialized PVC. The entrypoint passes them to the init-time server too.
        args:
        - "-c"
        - "config_file=/etc/postgresql/postgresql.conf"
        - "-c"
        - "hba_file=/etc/postgresql/pg_hba.conf"
        {{- end }}
        ports:
        - name: postgres
          containerPort: 5432
          protocol: TCP
        env:
        - name: POSTGRES_DB
          value: {{ .Values.postgresql.database | quote }}
        - name: POSTGRES_USER
          value: {{ .Values.postgresql.username | quote }}
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: {{ include "amp.postgresql.secretName" . }}
              key: password
        - name: PGDATA
          value: /var/lib/postgresql/data/pgdata
        volumeMounts:
        - name: postgres-data
          mountPath: /var/lib/postgresql/data
        # The default 64M /dev/shm fails parallel hash joins ("could not resize shared memory segment").
        - name: dshm
          mountPath: /dev/shm
        {{- if .Values.postgresql.config }}
        - name: custom-config
          mountPath: /etc/postgresql
          readOnly: true
        - name: custom-config
          mountPath: /docker-entrypoint-initdb.d/init.sql
          subPath: init.sql
          readOnly: true
        {{- end }}
        resources:
          {{- toYaml .Values.postgresql.resources | nindent 10 }}
        startupProbe:
          exec:
            command:
            - /bin/sh
            - -c
            - pg_isready -U {{ .Values.postgresql.username }} -d {{ .Values.postgresql.database }} -h 127.0.0.1
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 5
          successThreshold: 1
          failureThreshold: 30
        livenessProbe:
          exec:
            command:
            - /bin/sh
            - -c
            - pg_isready -U {{ .Values.postgresql.username }} -d {{ .Values.postgresql.database }} -h 127.0.0.1
          initialDelaySeconds: 60
          periodSeconds: 10
          timeoutSeconds: 5
          successThreshold: 1
          failureThreshold: 6
        readinessProbe:
          exec:
            command:
            - /bin/sh
            - -c
            - |
              pg_isready -U {{ .Values.postgresql.username }} -d {{ .Values.postgresql.database }} -h 127.0.0.1 &&
              psql -U {{ .Values.postgresql.username }} -d {{ .Values.postgresql.database }} -tAc "SELECT 1" > /dev/null
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 5
          successThreshold: 1
          failureThreshold: 3
        lifecycle:
          preStop:
            exec:
              command:
              - /bin/sh
              - -c
              - |
                su - postgres -c "pg_ctl stop -D $PGDATA -m fast -w -t 60" || true
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: false
          runAsNonRoot: true
          runAsUser: 999
          runAsGroup: 999
      {{- if .Values.postgresql.exporter.enabled }}
      # PostgreSQL Exporter sidecar (TN-98: metrics exposure)
      - name: postgres-exporter
        image: {{ .Values.postgresql.exporter.image }}:{{ .Values.postgresql.exporter.tag }}
        imagePullPolicy: {{ .Values.postgresql.exporter.pullPolicy | default "IfNotPresent" }}
        ports:
        - name: metrics
          containerPort: 9187
          protocol: TCP
        env:
        # User and password apart from the URI: no $(VAR) ordering, no URL escaping of the password.
        - name: DATA_SOURCE_URI
          value: "localhost:5432/{{ .Values.postgresql.database }}?sslmode=disable"
        - name: DATA_SOURCE_USER
          value: {{ .Values.postgresql.username | quote }}
        - name: DATA_SOURCE_PASS
          valueFrom:
            secretKeyRef:
              name: {{ include "amp.postgresql.secretName" . }}
              key: password
        # One database: discovery reran the cluster-wide queries per database, and the
        # duplicate series failed the whole scrape with HTTP 500.
        - name: PG_EXPORTER_AUTO_DISCOVER_DATABASES
          value: "false"
        - name: PG_EXPORTER_EXTEND_QUERY_PATH
          value: /etc/postgres-exporter/queries.yaml
        - name: PG_EXPORTER_DISABLE_DEFAULT_METRICS
          value: "false"
        - name: PG_EXPORTER_DISABLE_SETTINGS_METRICS
          value: "false"
        volumeMounts:
        - name: exporter-config
          mountPath: /etc/postgres-exporter
          readOnly: true
        resources:
          {{- toYaml .Values.postgresql.exporter.resources | nindent 10 }}
        livenessProbe:
          httpGet:
            path: /
            port: metrics
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /
            port: metrics
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 5
          failureThreshold: 3
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          runAsUser: 65534  # nobody
          runAsGroup: 65534
      {{- end }}
      terminationGracePeriodSeconds: 120
      volumes:
      - name: dshm
        emptyDir:
          medium: Memory
          sizeLimit: 256Mi
      {{- if .Values.postgresql.config }}
      - name: custom-config
        configMap:
          name: {{ include "amp.postgresql.fullname" . }}-config
          optional: false
      {{- end }}
      {{- if .Values.postgresql.exporter.enabled }}
      - name: exporter-config
        configMap:
          name: {{ include "amp.postgresql.fullname" . }}-exporter-config
          optional: false
      {{- end }}
  volumeClaimTemplates:
  - metadata:
      name: postgres-data
    spec:
      accessModes:
      - ReadWriteOnce
      resources:
        requests:
          storage: {{ .Values.postgresql.persistence.size | quote }}
      {{- if .Values.postgresql.persistence.storageClass }}
      storageClassName: {{ .Values.postgresql.persistence.storageClass | quote }}
      {{- end }}
{{- end }}
