# RBAC for publishing target discovery (PROD-RBAC-SCOPE, ADR-012).
#
# Grants exactly what the code calls: `Secrets(namespace).List(labelSelector)`
# in ONE namespace (go-app/internal/business/publishing/discovery_impl.go).
# The K8s client exists only when publishing is enabled and profile=standard
# (go-app/internal/application/publishing_runtime.go, initializePublishingRuntime);
# otherwise nothing is rendered. No cluster scope, no write verbs: add a verb
# here in the same change that makes the code call it.
#
# RBAC cannot filter `list` by label selector, so this Role reads every secret
# of the discovery namespace. Keep publishing-target secrets in a dedicated
# namespace (publishing.discovery.namespace) to keep the rest out of reach.
#
# `verbs` stays on one line: scripts/release-gate.sh (step_helm_rbac) checks it.
{{- if and .Values.serviceAccount.create .Values.serviceAccount.rbac.create (eq .Values.profile "standard") .Values.publishing.enabled }}
{{- $releaseNamespace := .Values.namespace | default .Release.Namespace }}
{{- $discoveryNamespace := .Values.publishing.discovery.namespace | default $releaseNamespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "amp.fullname" . }}-secrets-lister
  namespace: {{ $discoveryNamespace }}
  labels:
    {{- include "amp.labels" . | nindent 4 }}
    app.kubernetes.io/component: rbac
rules:
- apiGroups: [""]
  resources: ["secrets"]
  verbs: ["list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "amp.fullname" . }}-secrets-lister
  namespace: {{ $discoveryNamespace }}
  labels:
    {{- include "amp.labels" . | nindent 4 }}
    app.kubernetes.io/component: rbac
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "amp.fullname" . }}-secrets-lister
subjects:
- kind: ServiceAccount
  name: {{ include "amp.serviceAccountName" . }}
  namespace: {{ $releaseNamespace }}
{{- end }}
