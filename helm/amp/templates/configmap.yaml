{{- /* alertmanager.yml, as upstream Alertmanager reads it (--config.file). */}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "amp.fullname" . }}
  namespace: {{ include "amp.namespace" . }}
  labels:
    {{- include "amp.labels" . | nindent 4 }}
    app.kubernetes.io/component: application
data:
  alertmanager.yml: |
    {{- toYaml .Values.alertmanager.config | nindent 4 }}
