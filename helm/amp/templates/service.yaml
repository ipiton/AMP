apiVersion: v1
kind: Service
metadata:
  name: {{ include "amp.fullname" . }}
  namespace: {{ .Values.namespace | default .Release.Namespace }}
  labels:
    {{- include "amp.labels" . | nindent 4 }}
    # Metadata only, so the ServiceMonitor can select this Service and not the
    # postgres/redis ones. spec.selector stays selectorLabels: changing it in
    # the same release would drop the old pods from the endpoints before the
    # new ones are ready.
    app.kubernetes.io/component: application
  {{- with .Values.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.service.type }}
  # No session affinity for stateless load balancing
  sessionAffinity: None
  # Load balancing configuration
  {{- if .Values.service.loadBalancerPolicy }}
  sessionAffinityConfig:
    clientIP:
      timeoutSeconds: {{ .Values.service.sessionAffinityTimeout | default 10800 }}
  {{- end }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
      name: http
    - port: {{ .Values.service.metricsPort | default 9090 }}
      targetPort: metrics
      protocol: TCP
      name: metrics
  selector:
    {{- include "amp.selectorLabels" . | nindent 4 }}
