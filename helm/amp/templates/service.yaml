{{- /* api/v2, /-/*, /metrics of every AMP pod. */}}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "amp.fullname" . }}
  namespace: {{ include "amp.namespace" . }}
  labels:
    {{- include "amp.labels" . | nindent 4 }}
    # The ServiceMonitor selects this Service, not the headless one or the
    # postgres/Valkey Services, by component.
    app.kubernetes.io/component: application
  {{- with .Values.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - name: web
      port: {{ .Values.service.port }}
      targetPort: web
      protocol: TCP
  selector:
    {{- include "amp.appSelectorLabels" . | nindent 4 }}
