# Main application secrets
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "amp.fullname" . }}-secrets
  namespace: {{ .Values.namespace | default .Release.Namespace }}
  labels:
    {{- include "amp.labels" . | nindent 4 }}
    app.kubernetes.io/component: secrets
type: Opaque
data:
  # PostgreSQL credentials (if not using external secret)
  {{- if and .Values.postgresql.enabled (not .Values.postgresql.existingSecret) }}
  {{- $postgresPassword := .Values.postgresql.password | default (randAlphaNum 32) }}
  postgres-password: {{ $postgresPassword | b64enc }}
  {{- if .Values.postgresql.username }}
  postgres-username: {{ .Values.postgresql.username | b64enc }}
  username: {{ .Values.postgresql.username | b64enc }}
  {{- end }}
  {{- if .Values.postgresql.database }}
  postgres-database: {{ .Values.postgresql.database | b64enc }}
  {{- end }}
  # CloudNativePG required keys
  password: {{ $postgresPassword | b64enc }}
  {{- end }}

  # Valkey/Redis credentials (if authentication enabled)
  {{- if and .Values.cache.enabled .Values.cache.auth.enabled }}
  # NOT `| default (randAlphaNum 32)` like postgresql.password above: that
  # fallback is safe there because the SAME generated value is read back by
  # both the app (DATABASE_PASSWORD) and Postgres itself (POSTGRES_PASSWORD) —
  # a fresh random string on every render still matches both sides. Here,
  # cache.host may point at an EXTERNALLY managed Redis/DragonflyDB whose real
  # password this chart cannot know; a generated fallback would silently bake
  # in a value that doesn't match it — a mismatched-credential failure that
  # looks like a normal, well-formed Secret. `required` fails the render
  # instead, so an operator who left this blank finds out at `helm
  # install`/`helm template` time, not by debugging a live auth failure.
  {{- $redisPassword := required "cache.auth.password must be set when cache.auth.enabled is true — no safe random-generation fallback exists for a cache credential the chart doesn't own (see the comment above); set it via --set, CI secret injection, or a secret manager before install." .Values.cache.auth.password }}
  redis-password: {{ $redisPassword | b64enc }}
  {{- end }}

  # LLM API credentials
  {{- if .Values.llm.enabled }}
  {{- if .Values.llm.apiKey }}
  llm-api-key: {{ .Values.llm.apiKey | b64enc }}
  {{- end }}
  {{- if .Values.llm.authToken }}
  llm-auth-token: {{ .Values.llm.authToken | b64enc }}
  {{- end }}
  {{- end }}

  # Application secrets
  {{- if .Values.secrets.jwtSecret }}
  jwt-secret: {{ .Values.secrets.jwtSecret | b64enc }}
  {{- end }}
  {{- if .Values.secrets.encryptionKey }}
  encryption-key: {{ .Values.secrets.encryptionKey | b64enc }}
  {{- end }}
---
{{- if .Values.publishingTargets }}
{{- range $target := .Values.publishingTargets }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "amp.fullname" $ }}-{{ $target.name }}-target
  namespace: {{ $.Values.namespace | default $.Release.Namespace }}
  labels:
    {{- include "amp.labels" $ | nindent 4 }}
    app.kubernetes.io/component: publishing-target
    publishing-target: "true"
type: Opaque
data:
  config: {{ include "amp.publishingTargetConfigB64" (dict "target" $target) | quote }}
---
{{- end }}
{{- end }}
