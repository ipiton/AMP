{{- if and .Values.postgresql.enabled .Values.postgresql.networkPolicy.enabled }}
{{- $scrapers := dig "metricsScrapers" list (.Values.networkPolicy | default dict) }}
{{- /* A ServiceMonitor behind a policy that drops its scrapes looks configured and
reports nothing: PostgreSQLDown would fire on a healthy database. */ -}}
{{- if and (include "amp.postgresql.exporterScraped" .) (not $scrapers) }}
{{- fail "postgresql.networkPolicy.enabled=true blocks the postgres-exporter ServiceMonitor: set networkPolicy.metricsScrapers (it applies here even with networkPolicy.enabled=false), or postgresql.monitoring.serviceMonitor.enabled=false." }}
{{- end }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "amp.postgresql.fullname" . }}
  namespace: {{ .Values.namespace | default .Release.Namespace }}
  labels:
    {{- include "amp.labels" . | nindent 4 }}
    app.kubernetes.io/component: database
spec:
  podSelector:
    matchLabels:
      {{- include "amp.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: database
  policyTypes:
  - Ingress
  - Egress
  ingress:
  # Allow connections from AMP application pods
  - from:
    - podSelector:
        matchLabels:
          {{- include "amp.selectorLabels" . | nindent 10 }}
    ports:
    - protocol: TCP
      port: 5432
  # Allow connections from postgres-exporter sidecar (localhost)
  - from:
    - podSelector:
        matchLabels:
          {{- include "amp.selectorLabels" . | nindent 10 }}
          app.kubernetes.io/component: database
    ports:
    - protocol: TCP
      port: 9187  # Exporter metrics port
  {{- with $scrapers }}
  # Prometheus scraping the exporter (networkPolicy.metricsScrapers)
  - from:
      {{- toYaml . | nindent 4 }}
    ports:
    - protocol: TCP
      port: 9187
  {{- end }}
  egress:
  # Allow DNS resolution
  - to:
    - namespaceSelector:
        matchLabels:
          name: kube-system
      podSelector:
        matchLabels:
          k8s-app: kube-dns
    ports:
    - protocol: UDP
      port: 53
  # Allow outbound connections for backup archiving (if offsite)
  - to:
    - podSelector: {}
    ports:
    - protocol: TCP
      port: 443  # HTTPS for S3/GCS/Azure
{{- end }}
