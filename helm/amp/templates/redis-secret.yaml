{{- if eq .Values.profile "standard" }}
{{- if not .Values.valkey.password.existingSecret }}
{{/*
Redis Secret for Password Authentication
Creates Secret only if existingSecret is not provided
*/}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "amp.fullname" . }}-redis-secret
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "amp.labels" . | nindent 4 }}
    app.kubernetes.io/component: redis-secret
  annotations:
    # Secret description
    description: "Redis password for authentication"
type: Opaque
data:
  # Password (Base64 encoded)
  # Priority:
  # 1. Use values.valkey.password.value if provided
  # 2. Otherwise keep the password of the Secret already in the cluster
  # 3. Otherwise (first install) generate random 32-character password
  # Without 2 every helm upgrade rewrote the Secret with a new password while
  # the running Valkey kept the old one: AMP read the new one on its next
  # restart and was refused. lookup is empty under `helm template` and in
  # GitOps renders (Argo CD): there set valkey.password.value or existingSecret.
  {{- $existing := lookup "v1" "Secret" .Release.Namespace (printf "%s-redis-secret" (include "amp.fullname" .)) }}
  {{- if .Values.valkey.password.value }}
  password: {{ .Values.valkey.password.value | b64enc | quote }}
  {{- else if and $existing $existing.data (index $existing.data "password") }}
  password: {{ index $existing.data "password" | quote }}
  {{- else }}
  password: {{ randAlphaNum 32 | b64enc | quote }}
  {{- end }}
{{- end }}
{{- end }}
