{{- /*
Stable pod DNS names for the StatefulSet: the --cluster.peer addresses and
the per-pod targets Prometheus must send every alert to. Not-ready pods are
published, so a starting pod's peers resolve before its readiness probe
passes (Join runs at startup and memberlist retries only lost peers).
*/}}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "amp.headlessName" . }}
  namespace: {{ include "amp.namespace" . }}
  labels:
    {{- include "amp.labels" . | nindent 4 }}
    app.kubernetes.io/component: cluster
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  ports:
    - name: web
      port: 9093
      targetPort: web
      protocol: TCP
    - name: gossip-tcp
      port: 9094
      targetPort: gossip-tcp
      protocol: TCP
    - name: gossip-udp
      port: 9094
      targetPort: gossip-udp
      protocol: UDP
  selector:
    {{- include "amp.appSelectorLabels" . | nindent 4 }}
