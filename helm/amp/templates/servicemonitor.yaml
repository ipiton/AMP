{{- $sm := .Values.monitoring.serviceMonitor }}
{{- if and .Values.monitoring.prometheusEnabled $sm.enabled }}
{{- /* PROD-INGRESS-HARDENING (ADR-015): with web auth on, /metrics answers
401 to a scrape without credentials -- a failure visible only as empty graphs. */ -}}
{{- if and .Values.webConfig.existingSecret (not $sm.basicAuth.secretName) }}
{{- fail "webConfig.existingSecret protects /metrics, but the ServiceMonitor has no credentials and would only get 401. Set monitoring.serviceMonitor.basicAuth.secretName or monitoring.serviceMonitor.enabled=false." }}
{{- end }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "amp.fullname" . }}
  namespace: {{ .Values.namespace | default .Release.Namespace }}
  labels:
    {{- include "amp.labels" . | nindent 4 }}
    app.kubernetes.io/component: application
    {{- with $sm.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  # Only the AMP Service: the postgres/redis Services share selectorLabels but
  # carry their own component.
  selector:
    matchLabels:
      {{- include "amp.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: application
  namespaceSelector:
    matchNames:
      - {{ .Values.namespace | default .Release.Namespace }}
  endpoints:
    - port: http
      path: /metrics
      interval: {{ $sm.interval }}
      scrapeTimeout: {{ $sm.scrapeTimeout }}
      {{- with $sm.basicAuth.secretName }}
      basicAuth:
        username:
          name: {{ . }}
          key: {{ $sm.basicAuth.usernameKey }}
        password:
          name: {{ . }}
          key: {{ $sm.basicAuth.passwordKey }}
      {{- end }}
{{- end }}
