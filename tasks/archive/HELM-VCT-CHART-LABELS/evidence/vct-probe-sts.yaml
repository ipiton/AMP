  replicas: 0
  serviceName: t
  selector: {matchLabels: {app: t}}
  template:
    metadata: {labels: {app: t}}
    spec: {containers: [{name: c, image: busybox}]}
  volumeClaimTemplates:
  - metadata:
      name: d
      labels: {app: t, helm.sh/chart: amp-0.1.0, app.kubernetes.io/version: "0.1.0"}
